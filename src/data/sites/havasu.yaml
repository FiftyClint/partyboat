meta:
  title: "Lake Havasu Party Boats: Pontoons, Slide Boats, Captains"
  description: >-
    Party pontoons, slide boats and captained trips on Lake Havasu: the Channel rules, Copper
    Canyon, what a day costs, and who can drive on which side.

hero:
  headline: "Party boats on Lake Havasu, year round"
  subhead: >-
    Pontoons, slide boats and captained trips from the Channel and the marinas around Lake Havasu
    City. Tell us the date and the group, and we pass it to one local operator.

directAnswer: >-
  Most party boats on Lake Havasu are pontoons or tritoons you drive yourselves, with a few slide
  boats and a small number of captained trips. That makes the first question who in the group
  will drive and stay sober all day. If nobody will, book a captain. The season runs all year here:
  spring and summer are busiest and most expensive, and the cooler months are quieter and cheaper.
  Arizona and California share the lake, and the rules for who may drive differ between them, so
  read the rules section before you rent.

steps:
  - >-
    Send your dates, the size of the group, and whether you want to drive or have a captain. Mention
    if anyone is under 21, since some rental companies set their minimum age there.
  - >-
    We pass the request to one operator on Lake Havasu, so you get one answer about what is free
    rather than a dozen tabs of marketplace listings.
  - >-
    They confirm the boat, where you pick it up or launch, the deposit, fuel, and the return time.
    The rental agreement and payment are with them.

boatTypes:
  intro: >-
    Havasu is a self-drive lake more than most. The choice is between driving a rental yourselves,
    renting a bigger slide boat, or paying for a captain.
  types:
    - title: Self-drive pontoon or tritoon
      body: >-
        The most common rental here, taking a group of roughly eight to fifteen depending on the
        boat. You drive, you pay for the fuel you use, and a card deposit covers damage.
    - title: Slide boat or double-decker
      body: >-
        A pontoon with an upper deck and a slide, for groups of up to about eighteen. Fewer of these
        are available than standard pontoons, and some rent as self-drive.
    - title: Captained trip
      body: >-
        A smaller number of companies sell trips with a captain, from small charters for six to
        double-decker excursions and tiki boats. The easiest choice if the group wants to drink or
        nobody has driven a boat before.
    - title: Docked party barge
      body: >-
        A barge that stays tied up in the Channel all day as a floating base, with no captain and
        no driving. A different way to be on the water during a busy weekend.

departures:
  intro: >-
    Lake Havasu sits on the Colorado River, with Lake Havasu City and Arizona on the east shore and
    California on the west. Rental companies cluster around the Island and the London Bridge, with
    others at the state park, Site Six and the marinas to the south.
  places:
    - title: The Channel and the London Bridge
      body: >-
        The heart of the lake for visitors. Rental companies operate under and beside the London
        Bridge and at the Nautical Beachfront Resort on the Island, and a docked party barge sits in
        the Channel.
    - title: Lake Havasu State Park
      body: >-
        On London Bridge Road, with a large launch ramp and a rental company on site. The ramp
        charges a daily fee that is higher on weekends.
    - title: Site Six
      body: >-
        A launch ramp south of the Island used as a pickup point by at least one rental company. Its
        status has changed with construction, so confirm it is open.
    - title: Havasu Riviera Marina
      body: >-
        South of town, with a launch ramp and a captained tiki boat company. Launch fees are higher
        from April through September.
    - title: Delivered or launched for you
      body: >-
        Some rental companies keep offices away from the water on Industrial Boulevard and deliver
        or launch the boat at a ramp for you.
