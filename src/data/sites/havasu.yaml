  - slug: what-are-the-bridgewater-channel-rules-lake-havasu
    question: What are the boating rules in the Bridgewater Channel on Lake Havasu?
    answer: >-
      The Bridgewater Channel under the London Bridge on Lake Havasu is a no-wake zone with a 5 mph
      limit. Keep right of center, keep moving, and never stop or anchor where you block other
      boats. Swimming, water cannons, houseboats and boats 36 feet or longer are banned in the
      channel.
    detail: >-
      These rules come from the Lake Havasu City Code, as summarized on the city tourism bureau's
      channel law page, read on October 19, 2026. They cover speed, lane position, stopping, boat
      size and swimming.

      Speed and lanes. The limit is 5 mph with no wake. Stay to the right of center, much as you
      would driving a car, and expect boats coming the other way.

      Stopping and size. You may not stop, park or anchor a boat in a way that gets in the way of
      traffic. Watercraft 36 feet or longer are banned from the channel, and so are houseboats.
      Water cannons are illegal there. Nobody may swim in the channel or across it.

      What that means for a party boat. Treat the channel as a slow pass under the bridge, not a
      place to settle in for the afternoon. Pick a beach or a cove for swimming and floating. Out on
      the Arizona side of the lake, normal traffic runs counterclockwise, and nobody may ride on the
      bow deck, the gunwales or the transom while the boat is moving. A self-drive renter is
      responsible for all of this, so read the channel rules aloud before you leave the dock.
    sources:
      - label: Go Lake Havasu, Bridgewater Channel laws
        url: https://www.golakehavasu.com/things-to-do/boating/boat-safety/bridgewater-channel-laws/
        accessed: "2026-10-19"
      - label: Go Lake Havasu, Arizona boating laws
        url: https://www.golakehavasu.com/things-to-do/boating/boat-safety/arizona-boating-laws/
        accessed: "2026-10-19"
  - slug: what-is-copper-canyon-lake-havasu
    question: What is Copper Canyon on Lake Havasu, and what are the rules there?
    answer: >-
      Copper Canyon is a boat-only cove on Lake Havasu, 2.62 nautical miles from Thompson Bay
      according to the city tourism bureau. A federal rule keeps a 60-foot lane open down the
      canyon. Boats may not anchor, moor or loiter in that lane, and the Coast Guard can close it
      when the canyon gets congested.
    detail: >-
      You can only reach Copper Canyon by water. The city tourism bureau says no-wake buoys now
      mark the entrance, an access lane stays open for safety, and the cove is calmer than it was
      in earlier years.

      The lane is a Regulated Navigation Area under 33 CFR 165.1171. It is 60 feet wide and runs
      the length of the canyon. Any boat other than a patrol vessel has to pass straight through it,
      without anchoring, mooring or lingering. Patrol vessels include the Coast Guard, the Coast
      Guard Auxiliary and the San Bernardino County Sheriff.

      When the canyon is congested, the Coast Guard's Captain of the Port can close the lane, and
      the closure is announced on VHF channel 16. If your boat has a marine radio, keep it on 16
      as you head that way.

      For a self-drive group the plan is simple. Idle in at no-wake speed, stay clear of the marked
      lane, and find a spot outside it. If there is no room, come back later or pick another cove.
      A captain who works the lake will know how the canyon is being run that day, which is one
      reason some groups choose a captained trip for a Copper Canyon visit.
    sources:
      - label: Go Lake Havasu, Copper Canyon
        url: https://www.golakehavasu.com/directory/copper-canyon/
        accessed: "2026-10-19"
      - label: Code of Federal Regulations, 33 CFR 165.1171, Copper Canyon
        url: https://www.law.cornell.edu/cfr/text/33/165.1171
        accessed: "2026-10-19"
  - slug: when-is-party-boat-season-on-lake-havasu
    question: When is party boat season on Lake Havasu, and can you go in winter?
    answer: >-
      You can rent a party boat on Lake Havasu in any month. Peak season at one captained charter
      company runs March to September, and its rates drop from October to February, as of October
      2026. Summer monsoon storms can end a trip early, so keep a backup date in mind.
    detail: >-
      Seasonal pricing shows up at the ramps too. Havasu Riviera Marina charges launch fees of $15
      Monday to Thursday, $30 Friday to Sunday and $40 on holidays from April through September.
      From October through March its fees run $10 to $25.

      On the captained side, the charter company that posts rates charged $750 for four hours at
      peak and $300 for two hours in the offseason. A docked party barge in the Channel opens
      seven days a week during its season, from sunrise to sunset, and recommends reservations.
      Its online calendar listed open dates in October 2026.

      Summer is the hot part of the year, and one captained company reserves the right to end a
      trip early when monsoon weather moves in. Start in the morning, bring plenty of water and
      shade, and keep an eye on the sky.

      No company on the lake publishes how far ahead to book. For a holiday or a spring weekend,
      send a request as soon as your dates are fixed, and ask what happens to your money if the
      weather turns. A fall or winter date can also mean the lower offseason rate on a captained
      trip.
    sources:
      - label: Lake Havasu Charters, peak and offseason, monsoon policy
        url: https://lakehavasucharters.com/
        accessed: "2026-10-19"
      - label: Go Lake Havasu, launch fees by season
        url: https://www.golakehavasu.com/launch-ramps-marinas
        accessed: "2026-10-19"
      - label: Lake Havasu Party Boat, season hours
        url: https://lakehavasupartyboat.com/
        accessed: "2026-10-19"
  - slug: how-far-is-lake-havasu-from-las-vegas-and-phoenix
    question: How far is Lake Havasu from Las Vegas and Phoenix, and where should I fly in?
    answer: >-
      Lake Havasu City is roughly a three-hour drive from both Las Vegas and Phoenix, and those are
      the airports to fly into. The city's own airport has no scheduled airline service. The city
      names Harry Reid International in Las Vegas and Phoenix Sky Harbor as the nearest
      full-service airports.
    detail: >-
      Lake Havasu City Municipal Airport, code HII, has no airline flights. The city points
      visitors to Harry Reid International in Las Vegas and Phoenix Sky Harbor International.
      Driving estimates put each trip at about three hours, so treat them as approximate and allow
      for stops.

      Several rental companies work from the Island near the London Bridge. A few others work
      from offices on Industrial Boulevard and bring the boat to a ramp. If you are towing your own
      boat or meeting a rental at a ramp, know which ramp before you arrive.

      Public ramps charge a fee. Lake Havasu State Park lists $15 Monday through Thursday and $20
      Friday through Sunday and holidays, and it has no gas dock. The marina on the Island has seven
      lanes and a gas dock. Some lakefront resorts let their guests launch free from their own
      ramps, which makes staying on the water a practical choice.

      Build the drive into your plans. If your boat is booked for a morning start, arrive the night
      before, since a long drive and a wait at the ramp both cut into rental time.
    sources:
