pricing:
  summary: >-
    Prices published by Lake Havasu operators on October 19, 2026, as ranges, not quotes.

    Self-drive pontoons ran from $125 an hour, or $375 for four hours and $475 for eight at one
    company, and $600 to $1,350 a day at another depending on the boat, with a double-decker at the
    top of that range. A captained charter for up to six ran $750 for four hours in peak season,
    $175 for each extra hour, and $300 for two hours in the offseason, with fuel included. A docked
    party barge in the Channel ran $950 for a ten-hour day.
  components:
    - title: Deposits
      body: >-
        Card deposits on self-drive boats ran $300 to $800, and $1,000 on one captained tiki boat.
        One company also charges a $300 reservation fee.
    - title: Fuel and tax
      body: >-
        Usually extra on self-drive rentals. One company includes the first tank, one fuels the boat
        for you, and another charges a service fee plus a per-gallon price if it has to refuel. Fuel
        was included on the captained charter.
    - title: Captain's tip
      body: >-
        One captained company suggests a 20 percent tip for the captain. Budget for it.
    - title: Cancellation and weather
      body: >-
        Terms range widely, from a full refund a week out to no refund inside a week, and one
        company asks for 30 days for a full refund. One company gives a credit, not cash, when rain stops a trip.
        Read the policy before paying.
