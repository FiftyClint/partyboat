rules:
  summary: >-
    Two states on one lake. The Arizona side and the California side have different boating laws,
    and the line runs down the lake. Law enforcement from both counties patrols the whole lake.

    Who may drive on the Arizona side. Arizona sets 12 as the minimum operator age, and rental
    companies here say no boating license is needed to rent or drive in Arizona. That was true as of
    October 2026, but bills to require boater education have been proposed, so check Arizona Game
    and Fish before you go. Rental companies set their own minimum age, commonly 18 or 21, with a
    driver's license.

    California waters. California requires its residents to carry a California Boater Card, but
    the state exempts people operating a rental boat. The minimum age to drive a motorboat on the
    California side is 16.

    The Bridgewater Channel. The channel under the London Bridge is a no-wake zone of 5 mph. City
    code bans stopping or anchoring in a way that blocks traffic, bans boats 36 feet and longer and
    houseboats, bans swimming in or across the channel, and makes water cannons illegal.

    Copper Canyon. Federal rules keep a 60-foot lane open down the canyon. No anchoring, mooring or
    loitering in it, and the Coast Guard can close the lane when it gets crowded.

    Drinking and life jackets. Arizona's limit for the driver is .08 percent blood alcohol, and you
    can be charged below that if impaired. Children 12 and younger must wear a life jacket while
    the boat is moving. Arizona State Parks bans glass on designated beaches.

    Paying passengers. In April 2024 the Coast Guard stopped an illegal charter near Thompson Bay
    carrying nine paying passengers on a pontoon. More than six paying guests requires a Coast Guard
    inspected boat. Ask a captained operator for the captain's license and, for larger groups, the
    boat's Certificate of Inspection.
  sources:
    - label: Go Lake Havasu, Arizona boating laws
      url: https://www.golakehavasu.com/things-to-do/boating/boat-safety/arizona-boating-laws/
