guide:
  title: "Planning a party boat day on Lake Havasu"
  description: >-
    The Channel, Copper Canyon, two-state rules, heat, getting to Lake Havasu City, and how to
    choose between a rental and a captain on Lake Havasu.
  intro: >-
    Lake Havasu is a lake on the Colorado River between Arizona and California, with the London Bridge and its channel at the center of town. It is a party lake and a fishing lake, and the rules on the water reflect both. Here is what to know before you book a
    boat.
  sections:
    - title: The Channel is for cruising, not anchoring
      body: >-
        The Bridgewater Channel under the London Bridge is where everyone wants to be seen, but it is
        a narrow no-wake waterway. Keep right, keep moving, and do not stop or anchor where you block
        traffic. Swimming in the channel is banned. If you want to stay put, a docked barge or a beach
        is the way to do it.
    - title: Copper Canyon
      body: >-
        A boat-only cove long known for its party crowds. The entrance is now marked with
        no-wake buoys and a lane is kept open for safety, and the city's own guide says it is calmer
        than in years past. Do not anchor or tie up in the marked lane, and treat any cliff jumping
        as dangerous.
    - title: Know which state you are in
      body: >-
        The lake is split between Arizona and California, and age and licensing rules for drivers
        differ. Your rental company will tell you where its boats may go and who may drive. Officers
        from both sides patrol the whole lake.
    - title: Heat and wind
      body: >-
        Summers are very hot and the sun on the water is relentless. Bring more water than seems
        reasonable, shade, and sunscreen. Summer monsoon storms can end a trip early, and captains
        will make that call.
    - title: Getting here
      body: >-
        Lake Havasu City's airport has no airline service. The city points visitors to Las Vegas and
        Phoenix as the nearest full-service airports, each roughly a three-hour drive.
    - title: Staying near the water
      body: >-
        Several resorts on the lake have their own launch ramps, free for guests, including the
        Nautical Beachfront Resort on the Island. Staying near the Island or the Channel puts you close to several rental companies.
    - title: Fishing is a separate trip
      body: >-
        Havasu hosts bass tournaments through the year and striper guides work the lake. If you want
        to fish, say so on the request so it goes to the right kind of operator.
  sources:
    - label: Go Lake Havasu, Bridgewater Channel laws
      url: https://www.golakehavasu.com/things-to-do/boating/boat-safety/bridgewater-channel-laws/
      accessed: "2026-10-19"
