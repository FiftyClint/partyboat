faq:
  - question: Do we need a boating license to drive a rental?
    answer: >-
      On the Arizona side, rental companies say no license is needed to rent or drive, as of
      October 2026. California exempts people driving a rental boat from its boater card. Rental
      companies still set their own minimum ages. Check the rules section, because Arizona has
      considered changing this.
  - question: Can we anchor in the Channel?
    answer: >-
      No. The Bridgewater Channel is a no-wake waterway and you cannot stop or anchor where it
      blocks traffic, or swim in it. Cruise through, then head out to a cove or a beach.
  - question: Can we go to Copper Canyon?
    answer: >-
      Yes, by boat. Stay out of the marked lane that runs down the canyon, where anchoring and
      tying up are not allowed.
  - question: Should we get a captain?
    answer: >-
      If anyone driving would want to drink, yes. Most Havasu rentals are self-drive, and the
      driver must stay sober all day on busy, patrolled water. A captain also knows where the boat
      may go on each side of the lake.
  - question: How big a group can go on one boat?
    answer: >-
      Self-drive pontoons usually take about eight to fifteen people, and slide boats a few more. A
      captained boat carrying more than six paying guests needs to be a Coast Guard inspected
      vessel, so ask about that for a big group.
  - question: Is it too hot in summer?
    answer: >-
      It is very hot, and operators run right through it. Go early, bring shade and lots of water, and
      keep an eye on the sky for summer storms.
  - question: Are you a rental company?
    answer: >-
      No. We are an independent guide. We pass your request to one Lake Havasu operator, and they
      rent or run the boat and take your booking.

forOperators: >-
  Groups planning a Havasu weekend face a sea of marketplace listings and very little guidance
  about who can drive, where boats may anchor, or what happens on the California side. This site
  answers those questions and hands each request to one operator. We are looking for an operator
  who runs captained trips or slide boats for groups, works the spring season, and can show a
  current Coast Guard license and insurance.

