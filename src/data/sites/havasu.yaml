questions:
  - slug: how-much-does-a-pontoon-rental-cost-lake-havasu
    question: How much does it cost to rent a pontoon boat on Lake Havasu?
    answer: >-
      Self-drive pontoon rentals on Lake Havasu ran from about $125 an hour to $1,350 a day in
      prices published on October 19, 2026. One company charged $375 for four hours and $475 for
      eight. Tax, fuel and a refundable deposit usually come on top of the rental rate.
    detail: >-
      These figures come from the rental companies' own websites, read on October 19, 2026. Treat
      them as ranges to plan around, not quotes, and ask the operator for a written total before
      you pay anything.

      Hourly rentals start at $125 an hour at a company that works from under the London Bridge.
      That suits a short cruise through the Channel. A rental office at Lake Havasu State Park
      listed four hours for $375, a rate that applies Sunday through Friday, and eight hours for
      $475. It also listed multi-day rentals from $950 to $2,375.

      A company with offices on Industrial Boulevard prices by the day, from $600 to $1,350
      depending on the boat. Its standard pontoons seat 12 to 14 people, and its 16-passenger
      double-decker sits at the top of that range.

      The total moves mostly with boat size and hours. Deposits, fuel and sales tax are separate
      lines, and a reservation fee applies at one company. The question on deposits and fuel walks
      through what those added on top of the rate.
    sources:
      - label: At The Bridge Rentals, hourly rate
        url: https://atthebridgerentals.com/
        accessed: "2026-10-19"
      - label: Wet Monkey Powersport Rentals, pontoon rates
        url: https://www.wetmonkeyrentals.com/water-rentals/pontoon/
        accessed: "2026-10-19"
      - label: Lake Havasu RV and Boat Rentals, daily rates
        url: https://lakehavasurvrentals.com/
        accessed: "2026-10-19"
  - slug: how-much-does-a-captained-boat-charter-cost-lake-havasu
    question: How much does a boat with a captain cost on Lake Havasu?
    answer: >-
      A captained charter for up to six people on Lake Havasu ran $750 for four hours in peak
      season as of October 2026, with fuel included and $175 for each added hour. The same company
      listed $300 for two hours in the offseason. Some captained companies on the lake quote by
      phone only.
    detail: >-
      The charter company that posts its rates takes six guests or fewer. Its peak season runs
      March through September. From October through February it listed two hours for $300 and
      $140 for each hour after that. It also listed a sunset trip at $350. Fuel was included in
      every rate it published.

      A captained tiki boat that leaves from Havasu Riviera Marina gives prices by phone. It holds
      a $1,000 damage deposit, includes fuel, and suggests a 20 percent tip for the captain. Put
      that tip into any captained budget from the start.

      Above six paying guests the legal picture changes. A boat carrying more than six paying
      passengers needs a Coast Guard Certificate of Inspection, and the captain needs a Coast Guard
      license. Ask to see both before you pay. In April 2024 the Coast Guard ended a voyage near
      Thompson Bay where a 25-foot pontoon had nine paying passengers aboard, which shows the rule
      is enforced here.

      A captain costs more than a self-drive pontoon, but nobody in your group has to stay sober or
      learn the lake.
    sources:
      - label: Lake Havasu Charters, charter rates
        url: https://lakehavasucharters.com/
        accessed: "2026-10-19"
      - label: Tikitoons Boat Rental, deposit, fuel and tip
        url: https://tikitoonsboatrental.com/
        accessed: "2026-10-19"
      - label: U.S. Coast Guard, illegal charter terminated at Lake Havasu, April 2024
        url: https://www.news.uscg.mil/Press-Releases/Article/3765460/coast-guard-terminates-voyage-of-an-illegal-charter-vessel-in-lake-havasu-arizo/
        accessed: "2026-10-19"
  - slug: what-deposit-and-fuel-costs-lake-havasu-boat-rental
    question: What deposit and fuel charges should I expect when renting a boat on Lake Havasu?
    answer: >-
      Expect a refundable deposit of $300 to $800 on a self-drive rental at Lake Havasu, based on
      rates published on October 19, 2026, plus fuel and sales tax. Fuel policies vary by company.
      The captained companies that state a policy include fuel, and one rental company adds a $300
      reservation fee.
    detail: >-
      Deposits first. A rental company that picks up at Site Six holds a $500 refundable deposit.
      The rental office at Lake Havasu State Park holds $800. A company on Industrial Boulevard
      takes a $300 damage deposit and charges a separate $300 reservation fee. A captained tiki boat
      at Havasu Riviera Marina holds $1,000.

      Fuel policies differ more than the rates do. One company includes the first tank. The Site
      Six company charges $25 plus $5.85 a gallon if it has to refuel the boat after you bring it
      back. The Industrial Boulevard company bills you for the fuel you use, and the state park
      office lists tax and fuel as extra. Ask how the boat is fueled and how you will be charged
      before you sign.

      Cancellation is the other cost worth reading. The Industrial Boulevard company returns half
      the reservation fee if you cancel more than a week out and nothing inside a week. The tiki
      boat gives a full refund 30 or more days ahead, a credit if rain is falling at the start
      time, and no refund if rain starts after departure.

      Add the deposit, fuel, tax and any fees to the rate to see what the day really costs.
    sources:
