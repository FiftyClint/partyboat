  - slug: how-old-to-rent-and-drive-a-boat-lake-havasu
    question: How old do you have to be to rent and drive a boat on Lake Havasu?
    answer: >-
      Lake Havasu rental companies set the renter's minimum age at 18 or 21 with a driver's
      license, as of October 2026. State law sets a lower floor, 12 to operate a boat on the Arizona
      side and 16 to drive a motorboat on the California side. The rental company's own age rule is
      the one that decides.
    detail: >-
      Two age rules apply on this lake. The first is state law. Arizona sets 12 as its minimum
      operator age, and California sets 16 for motorized vessels, according to the city tourism
      bureau's boating law page. Arizona holds the east shore and California the west, so the rule
      depends on where the boat is.

      The second is the rental contract, and it is stricter. On October 19, 2026, the rental office
      at Lake Havasu State Park required renters to be 21 with a driver's license. A company that
      picks up at Site Six required renters to be 18 with a U.S. driver's license. Ask the company
      who in your group may take the wheel, not only who signs.

      Licensing is a separate question. That same Site Six company states that Arizona does not
      require a boating license to rent or drive. Arizona does not currently require a boater card
      for adults, based on what we found as of October 2026, but a 2024 bill in the Arizona House
      would have required boater education. Check Arizona Game and Fish before your trip. It also
      offers free boating courses.

      Whoever drives has to be old enough, sober, and comfortable steering a large pontoon all day.
    sources:
      - label: Go Lake Havasu, Arizona boating laws
        url: https://www.golakehavasu.com/things-to-do/boating/boat-safety/arizona-boating-laws/
        accessed: "2026-10-19"
