season:
  summary: >-
    Havasu boats all year. One captained charter company calls March through September its peak
    season and October through February its offseason, with lower prices in the cooler months. A
    marina charges higher launch fees April through September, and one party barge company opens
    seven days a week in season, sunrise to sunset, with reservations recommended.

    Summer heat is a real planning factor. One charter company reserves the right to end trips
    early for monsoon storms. No Havasu operator publishes a typical booking lead time, so for a
    spring or holiday weekend, ask as soon as your dates are set.
  sources:
