meta:
  title: "Lake Travis Party Boats, Barges and Bachelorette Cruises"
  description: >-
    Captained party barges and double-decker slide boats on Lake Travis: which marina, what a
    four-hour charter costs, and the Texas rules for party boats.

hero:
  headline: "Party boats on Lake Travis, with a captain"
  subhead: >-
    Bachelorette weekends, birthdays and team days on the water outside Austin. Tell us the date and
    the headcount, and we pass it to one local charter operator who quotes you directly.

directAnswer: >-
  On Lake Travis, a party boat almost always comes with a captain. The usual booking is a
  double-decker pontoon with a slide for a group of ten to twenty-five, or a big party barge for a
  larger crowd, for about four hours. Most trips leave from marinas on the south shore near
  Mansfield Dam or from Volente on the north shore, and many head for Devil's Cove, where boats tie
  up together. Saturdays cost the most and fill first, and holiday weekends go months ahead, so if
  your group is set on a summer Saturday, send the request now.

steps:
  - >-
    Send the date, or two or three dates that work, the size of the group, and the occasion. Say if
    you want to stop at Devil's Cove or would rather find a quieter spot.
  - >-
    We send it to one charter company on Lake Travis, so the group organizer gets one call back
    instead of chasing a dozen booking pages.
  - >-
    They tell you which boat fits, which marina, what the price includes, and their rules on drinks
    and glass. You book and pay the charter company, not us.

boatTypes:
  intro: >-
    The party market on Lake Travis is built around captained boats. Some companies do not let guests drive at all. What you choose is mostly a question of group size.
  types:
    - title: Double-decker slide boat
      body: >-
        The signature Lake Travis party boat: a pontoon or tritoon with an upper deck and a slide,
        a captain at the wheel, and room for roughly ten to twenty-five people depending on the
        boat. Most bachelorette groups book one of these.
    - title: Party barge
      body: >-
        A large flat barge with a captain and crew, built for bigger groups. Some companies run
        several and will put a very large party across more than one barge.
    - title: Captained yacht
      body: >-
        A cabin cruiser with a captain, for a smaller group that wants shade, a lounge and a calmer
        afternoon than a barge.
    - title: Shared party cruise
      body: >-
        Sold by the ticket rather than by the boat. One company runs a weekend disco cruise in
        season, which suits a small group or a bachelorette that wants a crowd without renting a
        whole boat.
    - title: Self-drive pontoon
      body: >-
        A few marinas still rent pontoons you drive yourself. Texas boater education rules apply to
        the driver, and the local guide explains them.

departures:
  intro: >-
    Lake Travis lies west of Austin, and party boats leave
    from a handful of marinas and parks, each with its own entry and parking rules, so check where
    yours starts before you plan the ride out.
  places:
    - title: Paradise Cove Marina, south shore
      body: >-
        On Rocky Ridge Road near Mansfield Dam and Hudson Bend, and a common base: several charter companies list it as their address. The marina charges
        an entry fee per person and a parking fee per car.
    - title: Mansfield Dam Park
      body: >-
        A Travis County park at the dam, used as a pickup point by several companies. Entry is per
        person and cash only. County park rules ban glass containers anywhere in the park.
    - title: Hurst Harbor and Lakeway
      body: >-
        Hurst Harbor Marina in Hudson Bend and Lakeway Marina further up the south shore both host
        captained charters, including a large party barge at Lakeway.
    - title: Volente, north shore
      body: >-
        A cluster of charter docks and marinas on FM 2769, including VIP Marina and the Volente
        Beach area, with big barges and double-deckers.
    - title: Anderson Mill Marina
      body: >-
        East of Volente on the north shore, where one company runs its large event boats and its shared weekend cruise.
    - title: Point Venture and Briarcliff, further west
      body: >-
        Up the lake, with double-decker tritoons at Point Venture and self-drive pontoon rentals at
        Briarcliff.
