pricing:
  summary: >-
    These are the ranges Lake Travis charter companies published on October 19, 2026. They are not
    quotes, and almost none of them is the final number, because tax, a gratuity of around 20
    percent, and sometimes fees come on top.

    A captained double-decker or party barge for four hours ran from about $700 on a weekday to
    $1,300 on a Saturday before tax and gratuity, with one marina's barge at $1,620.90 on a weekend
    including tax. Hourly rates for captained boats ran from $175 to $350. One company sells
    all-inclusive private charters from $857.03 to $1,911.83 with tax and gratuity already in, and
    seats on its shared weekend cruise at $125.26 to $138.44 a person. Self-drive pontoons at one
    marina ran $140 to $200 an hour with fuel.
  components:
    - title: Gratuity or service charge
      body: >-
        Expect around 20 percent for the captain and crew, sometimes called a service charge and
        sometimes collected in cash at the dock. It is usually not in the advertised price.
    - title: Tax and booking fees
      body: >-
        Sales tax is added by most companies. One adds a 6 percent fee for booking online that it
        waives by phone.
    - title: Fuel
      body: >-
        Included by many Lake Travis charter companies, which is one advantage of a captained boat.
        Confirm it on your quote.
    - title: Deposits and cancellation
      body: >-
        Deposits and cancellation terms vary more than anything else here. One company keeps a $250
        reservation deposit and charges in full inside two weeks, one marina allows no cancellations
        on its barge, and others refund on a sliding scale. Read the terms before you pay.
