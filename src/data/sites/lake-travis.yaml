season:
  summary: >-
    Lake Travis has a long season and some companies never stop. One major charter company describes
    peak season as April through October, busiest May through September, and says summer weekends and
    holidays can need two to four weeks of notice. Another says Memorial Day, the Fourth of July and
    Labor Day sell out months in advance.

    Winter is cheaper, not closed. On October 19, 2026 one company priced every boat at $200 an hour
    from October 1 to March 25, another ran an off-season special from $150 an hour, and a third ran
    private charters year round. September and October bring smaller crowds and lower prices.

    Every company that publishes rates charges more Friday through Sunday, with Saturday the most
    expensive day of the week.
  sources:
