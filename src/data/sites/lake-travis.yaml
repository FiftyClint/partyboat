  - slug: lake-travis-party-boat-cancellation-weather-policy
    question: "What happens to my Lake Travis party boat deposit if we cancel or the weather turns bad?"
    answer: >-
      It depends on the company, so read the terms before you pay. As of October 2026, Lake Travis
      policies ran from a nonrefundable $250 deposit with the full price due inside two weeks, to no
      cancellations at all on one marina barge, to a free reschedule when the captain calls off a
      trip for weather.
    detail: >-
      Here is how the published policies compared on October 19, 2026. One Volente barge company
      takes a $250 reservation deposit it keeps, plus a $500 incidental deposit you get back. Cancel
      with less than two weeks of notice and you owe the full charge. Cancel earlier and the $250
      becomes store credit. If it is raining at its office at your reservation time, you owe nothing
      more.

      A south shore company refunds the deposit, less a 6 percent fee, if you cancel 15 or more days
      out. From eight to three days out it refunds half, and inside 72 hours it charges the whole
      amount. It makes the weather call on the day, and only for unsafe conditions. Lakeway Marina
      allows no cancellations on its party barge.

      Other terms lean toward the customer. One north shore company reschedules for free when its
      captain cancels for weather and refunds part of the price if weather cuts the cruise short.
      Briarcliff Marina gives store credit only, with 48 hours of notice.

      Before you pay, ask who decides that the weather is too bad, what you get back, and whether it
      comes as cash or credit. Get the answer in writing.
