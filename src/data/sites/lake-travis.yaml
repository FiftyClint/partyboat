rules:
  summary: >-
    Party boat licensing. Texas Parks and Wildlife requires a Party Boat Operator License to run a
    charter boat of 30 feet or more carrying over six passengers on inland waters, together with a
    yearly inspection. A captain holding a Coast Guard license is exempt from the state license. In
    May and June 2025, state patrols on Lake Travis and Lake Austin found party boats with no proof
    of inspection, no insurance, missing licenses and passengers riding the top deck under way, and the state adopted new party boat rules in January 2026. Before you pay, ask the company for
    the captain's license and the boat's inspection.

    Who may drive a rental. Texas requires boater education for anyone born on or after September 1,
    1993 who drives a boat over 15 horsepower, unless someone 18 or older who may legally operate is
    aboard. Most party boats here come with a captain, which avoids the question.

    Drinks. Texas does not ban alcohol on boats, but the driver is held to the same .08 limit as on
    the road, and game wardens and the sheriff's office patrol Devil's Cove on busy weekends. Many charter companies ban glass on board, and Travis County bans glass in its parks.

    Life jackets. Children under 13 must wear one while the boat is moving.
  sources:
    - label: Texas Parks and Wildlife, party boat program
      url: https://tpwd.texas.gov/fishboat/boat/laws/party_boat/
      accessed: "2026-10-19"
