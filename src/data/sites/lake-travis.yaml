  - slug: texas-party-boat-license-lake-travis
    question: "Does a party boat captain on Lake Travis need a special license in Texas?"
    answer: >-
      Usually, yes. Texas Parks and Wildlife requires its Party Boat Operator License, plus a yearly
      inspection, for a charter of 30 feet or longer with more than six passengers on inland waters.
      A captain who holds a Coast Guard license is exempt from the state license. On Lake Travis, ask
      to see the credential and the inspection before paying.
    detail: >-
      The state rule reaches many of the boats party groups rent here, such as long pontoons and barges carrying
      more than six guests for pay. The operator needs either the state party boat license or a Coast
      Guard captain's license, and the boat needs its yearly state inspection. This guide does not say
      which agency covers a particular boat. Ask the company which credential its captain holds and
      ask to see it.

      The checks are not a formality. During saturation patrols in May and June 2025, state officers
      on Lake Austin and Lake Travis turned up party boats lacking evidence of inspection or proof of
      insurance, operators without licenses, and guests up on the top deck while the boat was moving. The Texas Parks and
      Wildlife Commission adopted new party boat rules in January 2026.

      The Coast Guard has also warned the public about illegal charters. Its advice includes asking to
      see the captain's credential and treating a price far below the local market as a warning sign.

      Renting a smaller boat to drive yourself brings a different rule. Anyone born on or after
      September 1, 1993 needs a boater education course to run a boat over 15 horsepower in Texas,
      unless a legal operator aged 18 or older is aboard.
