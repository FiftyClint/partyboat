  - slug: lake-travis-boat-alcohol-laws
    question: "Is it legal to drink alcohol on a party boat on Lake Travis?"
    answer: >-
      Yes. Texas does not ban alcohol on boats, so guests on a Lake Travis party boat may drink, but
      whoever drives is held to the 0.08 limit. Each charter company adds its own rules on top, such
      as cans only or ID for anyone drinking, and Travis County bans glass containers in its parks.
    detail: >-
      State law is simple. Drinking aboard is allowed, and the operator is held to the 0.08 limit,
      according to local reporting. On a captained charter, that limit is the captain's concern, not
      the guests'.

      Enforcement is real on busy weekends. Texas game wardens and the Travis County Sheriff's Office
      put several boats on the water over holidays, and TV coverage says wardens at Devil's Cove watch
      for excessive drinking, fights and speeding.

      Where you board matters too. Travis County park rules say no one may bring glass containers into
      any area of a county park, ban alcohol sales in the parks, and prohibit intoxicated people.
      Mansfield Dam Park, a pickup point for several companies, falls under those rules. No glass ban
      on the open water from the county or the river authority was found, so the rule on board comes
      from the boat company.

      Company rules vary. One requires guests to be 21 with ID to drink and allows beer in cans only.
      Another bans glass and plastic bottles but allows beer and wine in cans or boxes. Ask for the
      full list before you shop for drinks.
    sources:
