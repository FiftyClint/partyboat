guide:
  title: "Planning a party boat day on Lake Travis"
  description: >-
    Devil's Cove, getting to the marina from Austin, what to bring, the glass rule, and how to
    check that a Lake Travis party boat is properly licensed.
  intro: >-
    Lake Travis is twenty to twenty-five minutes from downtown Austin by operators' own estimates, and the party boat business here is mature. There are many charter companies, most
    with captains and slide boats, and the same few marinas and coves come up in every itinerary.
    Here is what to know before you book.
  sections:
    - title: Devil's Cove
      body: >-
        The best-known party spot on the lake, where boats anchor and tie up together. Not every charter goes there, so ask about the route when you
        book if it matters to your group. Low water makes shallow coves harder to use, which is another reason to leave the anchoring to a captain.
    - title: Other stops
      body: >-
        Charters also run to the area around Mansfield Dam, Starnes Island, the cliffs at Pace Bend,
        and quieter coves for swimming and sunset. A good captain will suggest a route that suits
        your group.
    - title: Getting to the marina
      body: >-
        The marinas are well outside the city, so plan the ride. At least one charter company recommends a group ride-share service.
        Companies ask you to arrive fifteen to thirty minutes early, longer on busy weekends.
        Austin-Bergstrom International is the airport.
    - title: What to bring
      body: >-
        Cans, not glass. Many charter companies ban glass on board, some also ban plastic bottles,
        red wine or glitter, and county parks used as pickup points ban glass outright. Bring ID:
        some companies require every guest to show government ID and sign a waiver before boarding.
        Professional sound equipment and live bands are banned by at least one company.
    - title: Lake levels
      body: >-
        The level of Lake Travis moves a lot, and that changes which coves and ramps are usable. It went from about 82 percent full in early June 2026 to about 95 percent in early September. Check the
        current level before the trip, or ask the operator.
    - title: Hippie Hollow is not a party stop
      body: >-
        McGregor and Hippie Hollow Park is a Travis County park where nobody under 18 is allowed. It
        is not a place to take a mixed-age group, and it is not a raft-up spot.
    - title: Fishing is a different trip
      body: >-
        On Lake Travis, a party boat means a celebration boat. If you want to fish, book a bass guide
        instead. Say so on the request and we will point you the right way.
  sources:
