  - slug: lake-travis-party-boat-for-large-groups
    question: "What kind of party boat fits a group of 30 or more people on Lake Travis?"
    answer: >-
      For 30 or more guests on Lake Travis, skip the double-deckers and look at captained party
      barges or event boats. Barges at Lakeway Marina and VIP Marina each carry up to 50 people, one
      company spreads groups of up to 300 across several barges, and two event boats list room for 31
      to 75 and 40 to 160.
    detail: >-
      The double-decker slide boats that most bachelorette parties book are built for smaller crowds
      than this, so a big group either splits across boats or moves up a size.

      A party barge is the usual next step. Lakeway Marina runs one for up to 50 people. In Volente,
      VIP Marina lists seven barges that each hold 50. A barge company on the south shore will put a
      large event across more than one barge, for up to 300 guests in all.

      For one big deck instead of a flotilla, two companies run event boats. One, based at Anderson
      Mill Marina on the north shore, lists a boat for 31 to 75 guests. Another lists a boat for 40 to
      160.

      Capacity is fixed boat by boat, so count everyone, including the friend who might join late.
      With a group this size, also sort out the ride to the marina early, because it will not fit in
      one or two cars.
