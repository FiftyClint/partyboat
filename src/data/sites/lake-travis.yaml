faq:
  - question: Can we drive the party boat ourselves?
    answer: >-
      Usually not on the big party boats. Most Lake Travis charter companies include a captain, and
      some do not allow guests to drive at all. A few marinas rent smaller pontoons you drive
      yourself, and Texas boater education rules apply to the driver.
  - question: Can we bring our own drinks?
    answer: >-
      Most charters are bring your own, in cans. Glass is banned on most boats that publish their rules, and in the county parks used as pickup points. Some companies also ban red wine, glitter or plastic
      bottles, so ask for the list.
  - question: How many people can we bring?
    answer: >-
      Double-decker slide boats take roughly ten to twenty-five depending on the boat, and party
      barges and event boats take far more. Give the operator your real headcount, because boats
      are licensed for a set number of passengers and the captain will not take more.
  - question: Is the price on the website the price we pay?
    answer: >-
      Rarely. A gratuity for the captain and crew, tax, and sometimes a booking fee are added. The
      pricing section shows how much these usually add.
  - question: Do the boats go to Devil's Cove?
    answer: >-
      Many do, but not all, and lake levels can change things. If Devil's Cove is the point of the
      trip, say so on the request.
  - question: How do we know the boat is legal?
    answer: >-
      Ask before you pay. A charter carrying more than six paying guests generally needs a properly licensed captain and an inspected boat. A
      legitimate company will show you both without fuss.
  - question: Who are you?
    answer: >-
      An independent guide. We do not own boats or employ captains. We pass your request to one Lake
      Travis charter company, and you book directly with them.

forOperators: >-
  Lake Travis has no shortage of charter companies, and the groups booking them, bachelorette and birthday parties among them, face a wall of near-identical booking pages.
  This site is written to help those organizers choose, and it hands each request to one charter
  company. We are looking for a licensed, inspected and insured operator with double-decker or
  barge capacity who answers new requests quickly through the spring and summer.

