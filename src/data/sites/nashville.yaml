  - slug: downtown-nashville-to-percy-priest-lake
    question: "How do we get from downtown Nashville to a party boat on Percy Priest Lake?"
    answer: >-
      From downtown Nashville, groups reach Percy Priest Lake by an operator shuttle or by driving to
      the dock. One lake operator checks guests in downtown and drives them about 15 minutes to the
      lake. Another meets groups at the Vivrett Creek public ramp in Mt. Juliet, roughly 20 minutes
      from downtown.
    detail: >-
      No lake party boat leaves from downtown itself, so transport is part of the plan. There are
      three common setups.
      Included shuttle. One bachelorette-focused company checks groups in downtown, then drives them
      to the lake at no extra charge. The ride out is about 15 minutes, the return about 45 minutes
      after the cruise, and the full outing four to five hours. It asks guests to arrive an hour
      before departure.

      Paid shuttle. Another lake company charges $295 for pickup within 20 miles and says the outing
      then takes five to six hours door to door. A third offers an optional shuttle but does not list
      the price, so ask for it in the quote.

      Driving yourselves. One company runs every pickup and drop-off from the Vivrett Creek Public
      Boat Ramp at 5598 Alvin Sperry Road in Mt. Juliet. Parking there is public and first come,
      first served, so arrive early on a summer weekend. If anyone plans to drink, settle on a driver
      or a ride home before the day starts.
      Whichever you choose, ask the operator for the exact meeting point and the total hours from
      pickup to return, then build dinner plans around that number.
