guide:
  title: "Planning a Nashville party boat"
  description: >-
    Lake or river, how to get from Broadway to the boat, Party Cove, what to bring, and how a
    Nashville bachelorette fits a boat into the weekend.
  intro: >-
    Nashville is not on a beach and its party lake is not downtown, which surprises a lot of
    visitors. The good news is that the city's operators have built their trips around exactly
    that: shuttles, downtown check-ins, and short cruises on the river for groups that do not want
    the drive.
  sections:
    - title: Lake or river
      body: >-
        Choose the lake for a half day of swimming, sun and a slide with your own drinks. Choose the
        river for a shorter cruise past the skyline that fits between brunch and Broadway, usually
        with a bar on board. The lake is the bigger commitment of time and the bigger day.
    - title: Getting to Percy Priest
      body: >-
        One operator says its downtown check-in is about 15 minutes from the lake, and its whole
        outing runs four to five hours including transport, with check-in an hour early. Another
        puts its ramp about 20 minutes from downtown. Nashville International is the airport.
    - title: Party Cove
      body: >-
        Percy Priest has a party cove where boats gather in summer. Captains can take you there or
        to a calmer stretch if your group prefers. At least one self-drive rental company does not
        allow its boats to go there.
    - title: What to bring
      body: >-
        Cans and plastic only, photo ID for anyone drinking, sunscreen, and cash for the captain's
        tip. Check the drink list with the operator: some ban liquor, and some will not allow any
        alcohol if a guest is under 21.
    - title: Where you can swim
      body: >-
        The Corps of Engineers allows swimming at Percy Priest only in designated areas, and never
        at ramps, marinas or public docks. A captain will know where the boat can anchor.
    - title: If you came to fish
      body: >-
        Percy Priest and Old Hickory are both well known fishing lakes, and striper guides work them.
        That is a different trip from a party boat. Tell us on the request and we will point you to
        the right kind of operator.
  sources:
