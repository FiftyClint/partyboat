  - slug: percy-priest-lake-party-cove
    question: "Is there a party cove on Percy Priest Lake near Nashville?"
    answer: >-
      Yes. Percy Priest Lake near Nashville has an area known as Party Cove, where boats gather
      in summer and form a floating party. Captained party boats can take a group there or
      to a calmer side of the lake instead. No official page publishes its exact location, and at
      least one self-drive rental company keeps its boats away.
    detail: >-
      Party Cove is a summer gathering spot, not a marina or a park, so the easiest way to see it is
      on a captained boat. One Percy Priest slide boat company describes it as the place boats collect
      in summer and lets each group decide whether to go or to stay on the quieter side. A tiki boat
      company sells a private Party Cove trip of three hours, starting at $525 as of October 2026.

      If you plan to rent a pontoon and drive it yourself, check the rental terms first. One rental
      company at the Nashville Shores marina does not permit its boats at Party Cove at all.

      Two safety points are worth knowing. The Army Corps of Engineers, which manages the lake, limits
      swimming to designated areas, so ask the captain where the group can get in the water. And
      Tennessee wildlife officers step up boating under the influence patrols around the Fourth of
      July, which is one more reason to leave the driving to a sober captain.

      Ask the operator how long the boat usually stays at the cove and what the plan is if the group
      wants to leave early.
