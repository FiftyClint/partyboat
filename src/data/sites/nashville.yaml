  - slug: nashville-party-boat-under-21
    question: "Can guests under 21 come on a Nashville party boat?"
    answer: >-
      Yes, guests under 21 can join many Nashville party boats, but the drink policy changes. Some
      operators let guests 21 and over drink with ID and mark the younger guests. Others run the whole
      cruise dry when anyone aboard is under 21, or ask for a parent on the trip. Tell the operator
      before you book.
    detail: >-
      Each operator sets its own policy, and the three lake companies checked for this site handle it
      three ways. One Percy Priest slide boat company lets the group bring its own drinks, in plastic with no
      glass. Guests must be 21 or older with ID to drink, and guests under 21 are marked with an X so
      the crew can tell them apart.

      A bachelorette-focused company says that if alcohol is on board, the whole group must be 21 or
      older, and guests under 21 need a parent on the tour.
      A third company allows bring your own drinks but bans liquor, glass and anything over 8% ABV,
      and requires photo ID when alcohol is aboard. If anyone in the group is under 21, the cruise
      must be alcohol free.

      For a mixed-age group, the practical move is to give the operator every guest's age range in the
      first message. That lets them match you to a policy that works before you pay anything.

      Children have one extra rule. Tennessee requires anyone 12 and younger to wear a life jacket on
      the open deck unless the boat is anchored, moored or aground. If you rent and drive a pontoon yourself instead, at
      least one rental company requires the operator to be 21 with a driver's license.
