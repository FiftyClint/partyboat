season:
  summary: >-
    The boating season in Nashville runs roughly spring to fall, with peak from May or Memorial Day
    through September or Labor Day. One downtown pedal boat runs from about March to about November.

    Lead time is the thing to plan around. One lake operator says peak season needs four to eight
    weeks of notice, and shoulder season and weekdays one to two weeks. A marina renting self-drive
    boats says to book one to two weeks ahead, especially for weekends, and a bachelorette-focused
    operator says groups fill its season and to book early. One rental company discounts after
    Labor Day.
  sources:
