  - slug: nashville-party-boat-cancellation-policy
    question: "What are the cancellation and weather refund rules for Nashville party boats?"
    answer: >-
      Nashville party boat cancellation terms are strict as of October 2026. Two captained companies
      refund in full only at 21 or more days out, offer a new date or gift card at 8 to 20
      days, and keep the payment inside 7 days. A captain's weather call often brings a gift card or
      a new date instead of cash.
    detail: >-
      Here is how the published terms compare, as read on October 19, 2026.
      A captained lake company gives a 100% refund at 21 days or more, a reschedule or gift card from
      8 to 20 days, and no refund inside 7 days. A weather cancellation gets a gift card for the full
      amount. Its own FAQ also says bookings within three weeks are non-refundable, which conflicts
      with those tiers, so get the terms that apply to your trip in writing.

      A tiki boat company uses the same 21, 8 and 7 day tiers. Its boats run rain or shine, and if
      the captain cancels for severe weather, the group gets a refund or a gift card.

      Self-drive rentals work differently. One marina on Percy Priest refunds the full deposit when
      you cancel 48 hours or more ahead. Another rental company gives no refunds for weather at all
      and offers a credit toward a future date instead.

      Two habits protect you. Ask who decides that weather is bad enough to cancel, and when that call
      gets made. And if your group is traveling in for the weekend, choose a date with a backup day
      that still works for most people.
