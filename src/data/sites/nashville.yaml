  - slug: how-far-ahead-book-nashville-party-boat-summer
    question: "How far ahead should we book a Nashville party boat for a summer weekend?"
    answer: >-
      Ask for a Nashville party boat four to eight weeks ahead for a summer weekend. One Percy Priest
      operator gives that window for Memorial Day through Labor Day. For weekdays and the shoulder
      months of April, May, late September and October, the same operator says one to two weeks is
      usually enough.
    detail: >-
      Peak dates need the most notice, and the earlier your date is set, the more choice of boat you have. A
      bachelorette-focused lake company says groups fill its season and advises booking early. A
      marina that rents self-drive pontoons on Percy Priest names May through September as its peak
      and suggests booking one to two weeks out, especially for weekends.

      Holiday weekends deserve extra lead time. The Fourth of July is also when Tennessee wildlife
      officers run heightened boating under the influence enforcement, so expect closer
      enforcement on the water.

      If your dates are flexible, the edges of the season can work in your favor. A downtown pedal
      boat runs from about March to about November, and one rental company on Percy Priest offers fall
      discounts after Labor Day.

      To move fast once you have a date, send the day, a backup day, the head count, lake or river,
      and whether anyone is under 21. Those are the details an operator needs to quote a boat. Read
      the cancellation terms before you pay a deposit, since at least two local companies refund in full
      only three weeks or more ahead.
