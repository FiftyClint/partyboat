meta:
  title: "Nashville Party Boats: Percy Priest Lake and the River"
  description: >-
    Bachelorette and birthday party boats in Nashville: lake pontoons on Percy Priest, river
    cruises downtown, shuttles, prices, and the drink rules.

hero:
  headline: "A party boat in Nashville, sorted"
  subhead: >-
    Lake day on Percy Priest or a cruise on the river downtown. Send the date and the group, and we
    pass it to one local captain who will call you with a boat and a price.

directAnswer: >-
  A Nashville party boat means one of two quite different things. The lake trip is a captained
  pontoon, often a double-decker with a slide, on J. Percy Priest Lake east of the city, for a
  group of up to about twenty, usually for three hours plus the ride out and back. The river trip
  is a shorter cruise on the Cumberland right by downtown, on a barge with a bar or a pedal boat,
  with no shuttle needed. For a summer weekend, operators recommend asking well ahead.

steps:
  - >-
    Tell us the weekend, the size of the group, and whether you want the lake or the river. If
    anyone in the group is under 21, say so, because it changes the drink rules on some boats.
  - >-
    We pass it to one Nashville operator who runs groups, rather than spreading your number around
    every company with a pontoon.
  - >-
    They confirm the boat, the pickup or dock, any shuttle from downtown, and the full price. You
    book and pay them.

boatTypes:
  intro: >-
    Nashville's party boats split by water. Lake boats are captained pontoons and tritoons. River
    boats are shorter cruises that leave near downtown.
  types:
    - title: Captained lake pontoon or slide boat
      body: >-
        The classic Nashville bachelorette boat. A captain drives, you bring the drinks, and the
        bigger boats have an upper deck and a slide. Groups of about eight to twenty-two depending
        on the boat.
    - title: Tiki boat
      body: >-
        A small round tiki bar boat with a captain, limited to a handful of passengers each, run as
        tandem boats for a bigger group. Available on the lake and on the river.
    - title: Downtown river barge
      body: >-
        A party barge with its own bar, cruising past the skyline for a couple of hours, sold as public tickets or as a private charter. Usually no outside drinks.
    - title: Pedal pontoon
      body: >-
        Everyone pedals, the captain steers, and the boat cruises the river downtown. A bring your
        own drinks option on the river.
    - title: Self-drive pontoon
      body: >-
        Marinas on Percy Priest and Old Hickory rent pontoons you drive yourself. Tennessee boater
        education rules and the marinas' own age rules apply, and some do not allow rentals to go to
        the party cove.

departures:
  intro: >-
    Most lake party boats run on J. Percy Priest Lake, an Army Corps of Engineers reservoir east of
    downtown, with Old Hickory Lake to the northeast as a second option. River cruises leave from
    the downtown riverfront. Where you start matters more here than in most places, because the lake is a drive from downtown.
  places:
    - title: Percy Priest, Mt. Juliet side
      body: >-
        At least one captained slide boat company uses the Vivrett Creek public boat ramp for all
        pickups, with first come, first served public parking, about 20 minutes from downtown.
    - title: Percy Priest, other docks
      body: >-
        Elm Hill Marina, Four Corners Marina near Antioch, and the marina at Nashville Shores in
        Hermitage rent boats, and the Cook public use area and Fate Sanders Marina are used as docks
        by captained charters.
    - title: Shuttle from downtown
      body: >-
        Some lake operators check you in downtown and drive the group to the boat and back, either
        included in the price or for a set fee. It adds time to the day but takes driving off the
        table.
    - title: Old Hickory Lake
      body: >-
        To the northeast, around Hendersonville and Gallatin, with a pontoon rental company at
        Creekwood Marina and a tiki boat company in Gallatin.
    - title: Downtown riverfront
      body: >-
        River cruises leave from the Riverfront Dock on Victory Avenue, from Wasioto Park beside
        Nissan Stadium, and from other docks along the Cumberland. Confirm your dock on the booking.
