  - slug: percy-priest-lake-vs-cumberland-river-cruise
    question: "Should we do Percy Priest Lake or a Cumberland River cruise in downtown Nashville?"
    answer: >-
      Pick Percy Priest Lake if your Nashville group wants a long afternoon of sun, swimming and a
      slide on a captained pontoon, with a drive or shuttle out of town. Pick a Cumberland River
      cruise if you want 90 minutes to two hours past the downtown skyline, often with a bar aboard,
      and no trip out of the city.
    detail: >-
      The lake trip is a bigger commitment. Captained boats on Percy Priest usually run three hours
      on the water, and the ride out and back adds more. Guests bring their own drinks in cans or
      plastic, and a captain can head for the party cove or a quieter part of the lake. One lake
      company meets groups at the Vivrett Creek public ramp in Mt. Juliet, about 20 minutes from
      downtown.

      The river trip is shorter and closer. One downtown barge sails from Riverfront Dock East at 2
      Victory Avenue and from Lock One Marina. It sells drinks on board for $5 to $10 and allows no
      outside beverages. Public tickets cover groups of 1 to 16, and private charters take up to 45.
      A pedal pontoon meets at Wasioto Park beside Nissan Stadium, lets guests bring their own drinks,
      and runs from about March to about November.

      A simple rule of thumb: if the boat is the main event of the weekend, go to the lake. If it is
      one stop between brunch and a night on Broadway, stay on the river. Either way, confirm the
      exact dock in writing, because river cruises use more than one landing.
    sources:
      - label: Rowdy Boats, lake trips and distance from downtown
        url: https://rowdyboats.net/
