questions:
  - slug: nashville-bachelorette-party-boat
    question: "Which kind of party boat should a Nashville bachelorette group choose?"
    answer: >-
      The classic Nashville bachelorette boat is a captained double-decker pontoon with a slide on
      Percy Priest Lake. A captain drives, the bride's crew brings drinks in cans or plastic, and
      some operators shuttle everyone out from a downtown check-in. Groups short on time can pick
      a two-hour cruise on the Cumberland River downtown instead.
    detail: >-
      The lake boats are the classic pick. As of October 2026, one Percy Priest company listed a
      30-foot triple slide boat for up to 22 guests, a 25-foot boat for up to 12, and two slide
      tritoons for up to 16 each. A bachelorette-focused company listed double-deckers for up to 14
      and single-level boats for up to 8. A standard lake cruise runs three hours on the water.

      Plan the day around the drive. One company checks groups in downtown, then rides about 15
      minutes out to the lake and about 45 minutes back after the cruise. Its whole outing takes four
      to five hours with transport, and it asks guests to arrive 60 minutes early. Plan for the
      boat to take most of an afternoon, with dinner and Broadway after.

      If the group would rather stay in town, the river has two formats. A 50-foot party barge runs
      two-hour cruises with its own bar and no outside drinks, as public tickets or as private trips
      for up to 45. A pedal pontoon lets up to 16 guests bring their own drinks. Tiki boats carry six
      passengers each and run in tandem for groups of up to 18.

      Before anyone pays a deposit, tell the operator if any guest is under 21, since that can change
      the drink policy, and ask to see the captain's license.
    sources:
      - label: Rowdy Boats, fleet and capacities
        url: https://rowdyboats.net/party-boat-fleet-3/
        accessed: "2026-10-19"
      - label: Nashville Toons, bachelorette trips and timing
