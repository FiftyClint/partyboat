faq:
  - question: How far is the party lake from downtown?
    answer: >-
      Percy Priest Lake is east of the city, and operators put their docks about fifteen to twenty
      minutes from downtown. Plan on the lake taking a good half of your day once you count the ride
      both ways. The local guide has the details.
  - question: Do we need a car?
    answer: >-
      Not always. Some lake operators run a shuttle from a downtown check-in, sometimes included in
      the price. River cruises leave from the downtown riverfront, so you can walk or take a short
      ride.
  - question: Can we bring our own drinks?
    answer: >-
      On most lake boats, yes, in cans or plastic, with ID. Downtown barges with a bar usually do not
      allow outside drinks. If anyone in the group is under 21, ask first, because some operators
      then run the whole trip dry.
  - question: How many of us fit on one boat?
    answer: >-
      Lake slide boats take roughly eight to twenty-two people depending on the boat. Tiki boats are
      small and run in tandem for bigger groups. Larger groups can split across boats.
  - question: What if it rains?
    answer: >-
      Captains cancel for severe weather. Most Nashville operators then give a new date or a gift
      card rather than a refund, and some run in light rain. Read the weather terms before you pay
      the deposit.
  - question: Is this the Nashville Party Barge?
    answer: >-
      No. That name also belongs to an open-air party vehicle that drives around downtown on land.
      This site is about boats on the water.
  - question: Who runs the boat?
    answer: >-
      A local operator, not us. We are an independent guide. We pass your request to one Nashville
      operator, who quotes and books directly with you.

forOperators: >-
  This site is written for out-of-town groups, bachelorette and birthday parties above all, who need to know that the lake is a drive away and the river is the other option. It explains the choice and sends each request to one operator. We are looking for
  a captained operator on Percy Priest or the river who runs group trips, can handle shuttle
  questions, and can show current captain credentials and insurance.

