rules:
  summary: >-
    Drinking and age. Tennessee makes it illegal to drive a boat at .08 percent blood alcohol or
    higher, and the state wildlife agency steps up enforcement around the Fourth of July. On a
    captained boat that is the captain's problem, not yours, but operators set their own rules for
    guests: most are bring your own with no glass, some ban liquor and strong drinks,
    and at least one makes the whole cruise dry if anyone aboard is under 21. Bring photo ID.

    Driving a rental yourself. Tennessee requires a boating education certificate for anyone born
    after January 1, 1989 who drives a boat over 8.5 horsepower, unless an adult born before that
    date is aboard and ready to take over. Marinas here generally require the renter to be 21 or older.

    Life jackets. Children 12 and younger must wear one on the open deck unless the boat is
    anchored, moored or aground. Drifting with the engine off still counts.

    The lake itself. Percy Priest and Old Hickory are Army Corps of Engineers lakes. The Corps
    restricts swimming to designated areas and bans it at ramps, marinas and public docks, and
    federal rules let the Corps ban alcohol in posted areas.

    Paying passengers. A captain carrying more than six paying guests generally needs a Coast Guard
    inspected boat. Ask any captained operator for the captain's license before you pay.
  sources:
    - label: Tennessee Wildlife Resources Agency, boating regulations
      url: https://www.tn.gov/twra/boating/regulations-and-safety-concerns.html
      accessed: "2026-10-19"
