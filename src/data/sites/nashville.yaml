pricing:
  summary: >-
    Published Nashville prices on October 19, 2026, as ranges. Your quote may differ.

    A captained lake party boat ran $250 to $500 an hour for the whole boat, with three hours the
    standard cruise. Another lake company started private trips at $495 on weekdays and $695 on
    weekends for up to 16, and sold shared seats from $49. Tiki boats started at $75 a person for a
    public cruise and $525 for a private three-hour trip. Self-drive pontoons ran about $350 to $725
    for a full day, some including tax and a fuel allowance.
  components:
    - title: The shuttle
      body: >-
        Lake trips are a drive from downtown. One company includes the shuttle both ways, another
        charges $295 within 20 miles and says the whole outing takes five to six hours door to door.
        Count the shuttle in when you compare prices.
    - title: Tip for the captain
      body: >-
        Lake operators ask guests to bring tip money. No standard percentage is published, so ask.
    - title: Deposits on self-drive boats
      body: >-
        Marinas hold a damage deposit, from about $300 to $1,500, and charge for fuel. One charges a
        steep hourly fee for late returns.
    - title: Cancellation and weather
      body: >-
        Terms are strict. At least two companies refund in full only three weeks or more ahead, and
        treat the last week as non-refundable. Weather cancellations by the captain usually get a
        gift card or a new date rather than cash. One rental company gives no refunds for weather at
        all.
