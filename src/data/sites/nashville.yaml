  - slug: nashville-party-boat-cost
    question: "How much does a party boat cost in Nashville?"
    answer: >-
      As published on October 19, 2026, a captained party boat on Percy Priest Lake near Nashville
      costs about $250 to $500 an hour for the whole boat, usually for three hours. Private lake trips
      for up to 16 started at $495 on weekdays and $695 on weekends. Tiki boats started at $75 a
      person.
    detail: >-
      These are published starting prices and ranges, not quotes. The figure you pay depends on the
      boat, the day of the week, the number of hours, and the extras below.
      Captained lake boats. One Percy Priest company priced its slide boats at $250 to $500 an hour
      for the whole boat, with a three-hour cruise as standard. A second lake company listed weekday
      private charters for up to 16 guests from $495, weekend charters from $695, and single seats on
      shared trips from $49 each.

      Tiki boats. A public tiki cruise of 90 minutes started at $75 a person. A private three-hour
      trip to the party cove started at $525.
      Self-drive pontoons. On Old Hickory Lake, one rental company charged $350 to $725 a day,
      depending on the boat and the day. You drive, so the boater education rules apply.

      Extras to count. Shuttles vary the most. One lake company includes transport from downtown both
      ways at no charge, while another charges $295 within 20 miles. Lake captains also ask guests to
      bring tip money, without naming a percentage. Add those to the boat price before comparing two
      quotes side by side.
