pricing:
  summary: >-
    These are ranges published by Lake of the Ozarks rental and charter companies on October 19,
    2026, not quotes. Prices change by season and day of the week, and the operator's quote is the
    one that counts.

    A self-drive tritoon ran about $290 to $520 for four hours and about $425 to $750 for a full
    day, plus fuel. A tritoon with a driver from the rental company ran from $375 for two hours to
    $1,075 for eight. Private captained charters on larger boats ran from about $700 for four hours
    on a weekday to $2,800 for a long Saturday, with holiday days higher still.
  components:
    - title: Fuel
      body: >-
        Most rentals leave full and charge you to refill when you return, so the posted rate is not
        the whole cost. A few captained charters include fuel. Ask which applies.
    - title: Deposit or card hold
      body: >-
        Self-drive rentals hold roughly $300 to $650 on a card against damage and cleaning. One
        company waives it when you hire their driver.
    - title: Captain and gratuity
      body: >-
        Charters often quote the boat plus fuel and gratuity. A captain added to a rental is usually
        a separate hourly charge.
    - title: Fees and cancellation
      body: >-
        One company adds an 8.5 percent processing fee and keeps it if you cancel 48 hours ahead.
        Another refunds all but 6 percent up to 24 hours ahead. Weather calls are made on actual
        conditions on the day, not the forecast.
