  - slug: where-is-party-cove-lake-of-the-ozarks
    question: Where is Party Cove at Lake of the Ozarks and how do you get there?
    answer: >-
      Party Cove is Anderson Hollow Cove on the Grand Glaize arm of Lake of the Ozarks. It sits
      roughly one mile south of the Grand Glaize Bridge, within the state park. You can only get
      there by boat. Rental docks beside the bridge in Osage Beach say the cove is 5 to 10 minutes
      away.
    detail: >-
      The cove sits near the 4 mile marker of the Grand Glaize arm, not on the main channel. It
      runs about a mile long and about 200 yards wide. There is no road or beach access, so every
      visitor arrives on a boat.

      The quickest start is a dock in Osage Beach near the Grand Glaize Bridge, around the 19 mile
      marker of the main channel. A dock farther down the lake means a longer ride each way, which
      eats into a four-hour rental.

      Before you book, check that the rental's operating area includes the Grand Glaize arm. One
      company's terms allow its boats up that arm only as far as Public Beach 1, at its 11.5 mile
      marker, and others set their own limits. Some companies sell cove packages, such as a
      floating lily pad, float saddles and an iced cooler, or a free floating mat.

      Once there, boats drop anchor and tie together in rows, which locals call rafting up. The
      state has called the area around the cove the most dangerous on the lake, and it has a long
      record of enforcement. A travel guide notes the cove is not as busy as it once was. Anchoring
      in a tight row of boats takes practice, which is why many groups bring a captain.
    sources:
