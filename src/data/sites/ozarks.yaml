meta:
  title: "Party Boat Rentals and Charters, Lake of the Ozarks"
  description: >-
    Tritoons and captained party boats on Lake of the Ozarks: where they leave from, what the
    price covers, and Missouri's rules for renters.

hero:
  headline: "Get a party boat on Lake of the Ozarks"
  subhead: >-
    Tell us the date, how many are coming, and whether you want a captain. We pass it to one
    local operator, who calls you back with a boat and a price.

directAnswer: >-
  Most groups on Lake of the Ozarks do one of two things: rent a tritoon and drive it
  themselves, or hire a captain so nobody in the group has to stay sober and sharp at the wheel.
  Self-drive suits a group of up to about a dozen with a confident driver who holds a Missouri
  boater card or can get a temporary one at the dock. A captain suits bachelorette parties, big
  birthdays, and anyone heading to Party Cove or the waterfront bars, where the crowds
  gather. Either way, summer Saturdays go first, so ask early if your date is
  a weekend between Memorial Day and Labor Day.

steps:
  - >-
    Use the form or call. A rough date and a rough headcount are enough to start. Say if anyone in
    the group already holds a Missouri boater card, because it changes what you can rent.
  - >-
    We send it to one operator on the lake who runs party groups, not to a list of companies that
    will all ring you at once.
  - >-
    The operator confirms which boat fits your group, which marina or dock it leaves from, the
    price including fuel and deposit, and their weather rules. You book and pay them directly.

boatTypes:
  intro: >-
    The lake is long and busy, and the right boat depends mostly on two things: how many people
    are coming, and whether someone in the group should be driving.
  types:
    - title: Self-drive tritoon or pontoon
      body: >-
        The standard lake party boat. Flat, stable, with bench seating and a swim ladder. Most are
        rated for ten to twelve people, a few for thirteen. You drive, you refuel at the end, and the
        rental company holds a deposit on a card until the boat comes back clean.
    - title: Tritoon with a driver
      body: >-
        The same boat with someone from the rental company at the wheel. Nobody in the group needs a
        boater card, and the driver knows how to anchor in a crowded cove, which is harder than it
        looks on a summer Saturday.
    - title: Private captained charter
      body: >-
        A larger cruiser or yacht with a licensed captain, sometimes a first mate as well. More
        comfort and shade, a cabin and a head on the bigger boats, and a captain who plans the route
        around coves and bars for you.
    - title: Party cruise or water taxi
      body: >-
        Bigger passenger vessels that sell seats or take private groups well past a dozen people.
        These are the boats built and inspected to carry large paying groups, and the simplest answer
        when your headcount runs into the thirties or forties.

departures:
  intro: >-
    Lake of the Ozarks has no single harbor. Rental fleets and charter docks are spread along the
    main channel and its arms, and locals give locations by mile marker counted up from Bagnell
    Dam. Where you start decides how far you travel before the fun starts,
    so pick a departure point close to where you plan to spend the day.
  places:
    - title: Lake Ozark and the dam end
      body: >-
        The low mile markers near Bagnell Dam, including Village Marina at the 3 MM, Camden on the
        Lake at the 7 MM and the Lodge of Four Seasons at the 12 MM, all host rental docks. This is
        the end for the Bagnell Dam strip and the bars around the 7 MM.
    - title: Osage Beach and the Grand Glaize Bridge
      body: >-
        The busiest stretch for party groups, roughly the 17 to 19 MM. Rental docks here sit next to
        well known waterfront bars, and the ones by the Grand Glaize Bridge describe themselves as
        five to ten minutes by boat from Party Cove.
    - title: The Margaritaville resort area
      body: >-
        Around the 26 MM, at the resort that used to be Tan-Tar-A. A charter cruise company leaves
        from here, and one delivery service brings boats free as far as this point.
    - title: Camdenton and the Niangua arm
      body: >-
        The southwest arm, with resort marinas and gas docks that rent tritoons, measured by its own
        mile markers up the Niangua. A natural base if you are staying near Camdenton.
    - title: Sunrise Beach and the west side
      body: >-
        Resort marinas and waterfront restaurants on the western side of the lake. Check the trip
        time by water if Party Cove or the Osage Beach bars are the plan.
    - title: Delivered to your dock
      body: >-
        If you are staying in a lake house, some companies will bring a tritoon to your dock, one free
        within a set stretch of mile markers and another for a fee each way.
