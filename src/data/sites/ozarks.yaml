  - slug: captain-or-self-drive-party-boat-lake-of-the-ozarks
    question: Should we hire a captain or drive the party boat ourselves on Lake of the Ozarks?
    answer: >-
      On Lake of the Ozarks, drive yourselves if one person will stay sober all day and holds or
      can get a Missouri boater card. Hire a captain if everyone wants to drink, if nobody has
      handled a tritoon before, or if you plan to anchor in a crowded cove on a summer weekend.
    detail: >-
      The deciding question is who drives. Missouri treats a boat driver with a blood alcohol
      level of .08 percent as intoxicated, and the line drops to .02 percent for anyone under 21.
      Running a boat counts as consent to a test. If a child under 17 is aboard, the charge is a
      class A misdemeanor. A captain takes all of that off your group.

      The license question matters too. Drivers born after January 1, 1984 and before 2006 need a
      boater card on Missouri lakes, and a rental dock can sell a one-time temporary card for $9 if
      you bring a driver's license. With a hired driver, nobody in the group needs one.

      Cost is the main argument for self-drive. At one Osage Beach company, eight hours on a
      tritoon cost $675 if you drive and $1,075 with their driver, a gap of $400 for the day.
      Another company drops the damage deposit when you hire one of its drivers, which keeps the hold
      off your card.

      Self-drive works well on a quiet weekday with a careful driver. For a holiday weekend, a raft
      up at Party Cove, or a bar crawl by water, the captain usually earns the fee.
    sources:
      - label: Missouri State Highway Patrol, boating while intoxicated brochure SHP-44
        url: https://www.machs.mo.gov/MSHPWeb/Publications/Brochures/documents/SHP-44.pdf
