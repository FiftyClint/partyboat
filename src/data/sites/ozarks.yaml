faq:
  - question: Do I need a boater card to drive a rental tritoon?
    answer: >-
      Probably, if you were born after January 1, 1984. Missouri requires a boating safety
      identification card for most drivers on its lakes, and the rental company can usually issue a
      one-time temporary card at the dock if you bring a driver's license. If nobody in the group
      has one and you would rather not deal with it, ask for a boat with a driver. The local guide
      has the exact rule.
  - question: Can we take the boat to Party Cove?
    answer: >-
      Usually, but check. Each rental company sets an operating area, and not all of them cover the
      Grand Glaize arm. Party Cove is also the most crowded and most patrolled water on the lake on a
      summer weekend, which is why many groups hire a captain for it.
  - question: How many people fit on a party boat here?
    answer: >-
      Most self-drive tritoons are rated for ten to twelve people. For bigger groups you need either
      two boats or a larger passenger vessel built and inspected to carry that many paying guests.
      Tell us the real headcount, including anyone who might join late, and the operator will match
      the boat to it.
  - question: Is fuel included?
    answer: >-
      Usually not on self-drive rentals. Most leave full and charge you to refill. Some captained
      charters include fuel. The pricing section above lists what operators charge for, and the
      operator's quote will say exactly.
  - question: Can we bring alcohol?
    answer: >-
      Many groups do, but the person driving must stay under Missouri's legal limit, which is lower
      for anyone under 21, and some operators set their own rules. On a captained boat the captain
      drives, which is the main reason party groups book one.
  - question: What happens if it storms?
    answer: >-
      The operator decides, based on conditions on the day rather than the forecast a week out.
      Cancellation terms differ between companies, so ask before you pay a deposit, and get the
      weather policy in writing.
  - question: Who are you, and who actually takes us out?
    answer: >-
      We are an independent guide. We do not own or run boats. When you send a request, we pass it
      to one local operator who runs party groups on this lake, and they confirm the boat, the price
      and the booking with you. Your trip is with them.

forOperators: >-
  This site is written for people planning a party day on Lake of the Ozarks from somewhere else:
  bachelorette and birthday groups, families sharing a lake house, and anyone who has never driven
  a tritoon and wants someone local to tell them what to book. We are
  looking for one operator on the lake to receive its trip requests, ideally one that runs both
  self-drive tritoons and captained trips, answers the phone on summer weekends, and holds current
  captain credentials and insurance.

