  - slug: bachelorette-party-boat-lake-of-the-ozarks
    question: What kind of boat is best for a bachelorette party on Lake of the Ozarks?
    answer: >-
      For a bachelorette party on Lake of the Ozarks, book a captained boat so the bride and every
      guest can drink. A tritoon with a driver suits up to 12 people. A
      private cruiser charter suits a group that wants a captain planning the route. Groups well
      past a dozen fit best on an inspected passenger vessel.
    detail: >-
      Rental and charter companies on the lake market directly to bachelorette groups. Start with
      the headcount, then decide who drives.

      For up to a dozen, a tritoon with a hired driver is the simple choice. One Osage Beach
      company lists two to eight hours with its driver. Private charters on bigger cruisers take a
      similar number, 12 guests on one company's 42 foot boat, with a captain who plans the stops
      around coves and bars.

      For a big party, look at the passenger catamarans. One water taxi company runs boats inspected
      by the Coast Guard for 36, 43 and 49 passengers and sells scheduled bar hop cruises as well as
      private trips. That keeps everyone on one deck instead of splitting the party.

      If you plan to self-drive instead, whoever drives must stay below a blood alcohol level of .08
      percent, or .02 percent if under 21. That is a hard ask on a bachelorette day.

      Before paying for any captained trip, ask the captain to show a Coast Guard license. The Coast
      Guard has given that advice after shutting down unlawful charters on this lake.
    sources:
      - label: Missouri State Highway Patrol, boating while intoxicated brochure SHP-44
