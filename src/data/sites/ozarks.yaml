rules:
  summary: >-
    Who may drive. Missouri changed its boater card law for 2026. Anyone born after January 1, 1984
    and before January 1, 2006 must carry a boating safety identification card when driving on the
    state's lakes, and from January 1, 2027 anyone born on or after January 1, 2006 needs one on all
    state waters. A rental company may issue a once-in-a-lifetime temporary card good for up to
    seven days, for a $9 fee, if you show a driver's license and sign that you have read the Highway
    Patrol boating handbook. The Patrol says an operator must be 14 unless an adult is aboard, and
    many rental companies set their own minimum age higher, some at 21 or 25.

    Drinking. Boating while intoxicated in Missouri means a blood alcohol level of .08 percent or
    higher, or .02 percent for anyone under 21. By driving a boat you agree to be tested. With a
    child under 17 aboard, it is a class A misdemeanor.

    Life jackets. Every person aboard needs a wearable life jacket of a type the Coast Guard has approved, and
    children under seven must wear one.

    Paying passengers. Federal rules limit how many paying guests an uninspected boat may carry
    with a captain, generally six, and boats carrying more need a Coast Guard Certificate of
    Inspection. The Coast Guard has shut down unlawful charters on this lake, four vessels in 2021
    and one carrying 12 passengers in 2023, and it tells passengers to ask to see the captain's
    license before boarding. If you book a captained boat, ask.
  sources:
    - label: Missouri Revisor of Statutes, RSMo 306.127, boater identification card
      url: https://revisor.mo.gov/main/OneSection.aspx?section=306.127
      accessed: "2026-10-19"
    - label: Missouri State Highway Patrol, boater education law FAQs
      url: https://apps.mshp.dps.mo.gov/MSHPWeb/WaterPatrol/BoatingLaws_Education/boaterEduLawFAQ.html
      accessed: "2026-10-19"
    - label: Missouri State Highway Patrol, boating while intoxicated brochure SHP-44
      url: https://www.machs.mo.gov/MSHPWeb/Publications/Brochures/documents/SHP-44.pdf
      accessed: "2026-10-19"
    - label: Missouri Revisor of Statutes, RSMo 306.100, life jackets
      url: https://revisor.mo.gov/main/OneSection.aspx?section=306.100
      accessed: "2026-10-19"
    - label: U.S. Coast Guard, Passenger for Hire and Charter Vessel Operations (pamphlet)
      url: https://wow.uscgaux.info/Uploads_wowII/P-DEPT/PaxForHire_trifold_3.pdf
      accessed: "2026-10-19"
    - label: Missourinet, Coast Guard terminates charter at Lake of the Ozarks, July 2023
      url: https://www.missourinet.com/2023/07/17/u-s-coast-guard-busts-chartered-boat-at-lake-of-the-ozarks/
