season:
  summary: >-
    The rental season runs roughly from mid-March or April to mid-October, with some companies
    renting by appointment through the winter and others closed until May. One operator says it
    reopens in May 2027, and another ends its regular season on October 31, 2026.

    The busy months are May through August. The Missouri State Highway Patrol's own numbers show
    where the boats are: in 2024, 79.7 percent of the state's boating crashes happened May through
    August, July was the worst month, and Saturday was the worst day.

    Holiday weekends and lake events cost more and fill first. Operators price the Fourth of July,
    Labor Day and the Lake of the Ozarks Shootout as holidays. Rental companies recommend
    reserving ahead, and at least one offers a discount for booking party packages early. Nobody
    publishes a typical lead time, so if your date is a summer Saturday, the safe answer is now.
  sources:
