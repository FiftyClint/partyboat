  - slug: is-a-party-boat-charter-legal-lake-of-the-ozarks
    question: How can I tell if a captained party boat charter on Lake of the Ozarks is legal?
    answer: >-
      Before paying for a captained charter on Lake of the Ozarks, ask to see the captain's Coast
      Guard credential. A boat carrying more than six paying guests with a crew generally needs a
      Coast Guard Certificate of Inspection. The Coast Guard has stopped charters on this lake that
      had neither, and it tells passengers not to board without proof.
    detail: >-
      Federal rules sort paid boat trips by how many guests are aboard. A boat under 100 gross tons
      with up to six paying passengers can run uninspected, but its captain needs at least an
      operator license, often called a six-pack license. Carry more than six for pay and the boat
      must be an inspected small passenger vessel. A bareboat charter, where no crew comes with the
      boat, may take up to 12 under a written contract that leaves the group free to pick and pay
      its own captain.

      Enforcement here is real. In June 2021 the Coast Guard ended voyages on four vessels on the
      lake for carrying passengers for hire unlawfully. On July 1, 2023 it terminated a charter
      carrying 12 passengers over a missing Certificate of Inspection, no credentialed mariner, and
      problems with the boat's papers.

      Three questions settle most of it. How many paying guests is the boat certified or allowed to
      carry? Can the captain show a Merchant Mariner Credential? If the group is over six, where is
      the Certificate of Inspection? A legitimate operator answers all three without fuss. For big
      groups, some vessels on the lake are inspected for 36 to 49 passengers, which avoids the
      question entirely.
    sources:
      - label: U.S. Coast Guard, Passenger for Hire and Charter Vessel Operations (pamphlet)
        url: https://wow.uscgaux.info/Uploads_wowII/P-DEPT/PaxForHire_trifold_3.pdf
        accessed: "2026-10-19"
      - label: Missourinet, Coast Guard terminates charter at Lake of the Ozarks, July 2023
        url: https://www.missourinet.com/2023/07/17/u-s-coast-guard-busts-chartered-boat-at-lake-of-the-ozarks/
        accessed: "2026-10-19"
