  - slug: how-old-to-rent-a-boat-lake-of-the-ozarks
    question: How old do you have to be to rent and drive a boat at Lake of the Ozarks?
    answer: >-
      Missouri lets a person drive a boat at Lake of the Ozarks from age 14, or younger with an
      adult aboard, but rental companies set higher minimums. Published rules on the lake include
      18 for the primary renter at one company, 21 at another and 25 at a third. The driver may
      also need a Missouri boater card.
    detail: >-
      State law and company policy are separate. The Highway Patrol says a boat operator must be 14
      unless an adult is on board, and a child under 14 driving with an adult still needs a boater
      card. That is the legal floor. A rental company can, and usually does, ask for more.

      On the lake, one company requires the primary renter to be at least 18. One Osage Beach dock
      sets the driver age at 21, and one Camdenton marina sets it at 25. Ask the company directly,
      and name the person who will drive, before you pay a deposit.

      The boater card rule depends on birth year. For 2026, it covers drivers on Missouri lakes whose
      birthday falls after January 1, 1984 and before January 1, 2006. Younger drivers, born in
      2006 or later, join the rule on January 1, 2027, and theirs applies on every state water. You qualify by passing an approved
      course or an equivalency exam, or by holding a Coast Guard master's, mate's or operator's
      license. Visitors who already hold an approved card from another state are exempt.

      A rental business may sell a temporary card for $9 that lasts up to seven days. You need a
      valid driver's license and must sign a statement that you reviewed the Patrol's boating
      handbook. Each person gets one in a lifetime.
    sources:
      - label: Missouri State Highway Patrol, boater education law FAQs
        url: https://apps.mshp.dps.mo.gov/MSHPWeb/WaterPatrol/BoatingLaws_Education/boaterEduLawFAQ.html
