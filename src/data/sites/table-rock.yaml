season:
  summary: >-
    Marinas wind down in late fall. On October 19, 2026 one marina on the James River arm had
    closed for the winter, another in Arkansas rents by appointment only from November through
    March, and one on the Branson side was open five days a week. A Cape Fair marina rents in
    winter with 24 hours notice.

    The heavy months are May through August. Across Missouri, 79.7 percent of 2024 boating crashes
    happened in those four months and July was the worst, which tracks where the traffic is.
    Memorial Day weekend 2026 packed the state park marina.

    No marina publishes a typical booking window. The largest slide boats are few, and the state park marina takes online reservations only for longer rentals and sells its three-hour rentals
    walk-up only. For a summer weekend, ask early.
