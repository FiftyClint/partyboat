guide:
  title: "Planning a day on Table Rock Lake"
  description: >-
    Swim coves, weather, getting to Branson, where to stay, and how to choose between a slide
    boat, a tritoon and a captain on Table Rock Lake.
  intro: >-
    Table Rock Lake was built by the Army Corps of Engineers in the 1950s on the White River, and
    the Corps still runs it. It covers about 43,100 acres with roughly 745 miles of shoreline,
    reaching from Branson west toward Cassville and south into Arkansas.
  sections:
    - title: Coves, not a party cove
      body: >-
        Table Rock has no single famous raft-up spot. Boaters pick a cove, anchor, swim and float.
        Local magazine favorites include the bluffs near Old 86 Campground and Cow Creek on Point 6,
        between the state park and Kimberling City, a deep, undeveloped cove that works as a meeting
        spot. The captain or the marina will have their own favorites for your group.
    - title: About cliff jumping
      body: >-
        People do jump from the bluffs. Operators treat it as entirely at the guest's own risk, and
        so should you. Check depth, never jump where you cannot see the bottom clearly, and do not
        let anyone who has been drinking climb.
    - title: Weather is the one thing to respect
      body: >-
        In July 2018 a tour duck boat sank on this lake in a severe storm, with winds reported above 70 mph, and seventeen people died. Marinas and captains here cancel for unsafe weather, and you should not push them to go.
    - title: Getting here
      body: >-
        Springfield-Branson National is the main airport, about 50 miles north of Branson. The small
        Branson Airport is about eight miles out with limited seasonal flights, and Northwest
        Arkansas Regional is about two hours away. By road, most visitors come down I-44 to
        Springfield and then south on US 65.
    - title: Where to stay
      body: >-
        Lakefront resorts and marinas cluster on the Branson side of the lake, and Big Cedar's
        resorts sit south of town at Ridgedale. Kimberling City has a resort and campground at the
        Port of Kimberling. If the group also wants Branson shows or Silver Dollar City, staying on
        the Branson side keeps the drives short.
    - title: Fishing or a party day
      body: >-
        Table Rock is a serious bass fishing lake, and many marinas rent fishing boats alongside
        their pontoons. If your group wants to fish, say so on the request and it goes to an
        operator set up for it. If you want a slide, music and a cove, say that instead.
    - title: The safety record
      body: >-
        Table Rock had 24 boating crashes in 2024, two of them fatal, second only to Lake of the
        Ozarks among Missouri waters. A sober driver and life jackets on the kids cover most of it.
  sources:
    - label: Wikipedia, Table Rock Lake
      url: https://en.wikipedia.org/wiki/Table_Rock_Lake
      accessed: "2026-10-19"
    - label: 417 Magazine, best coves in Southwest Missouri, August 2018
      url: https://417mag.com/issues/august-2018/5-best-coves-southwest-mo
      accessed: "2026-10-19"
    - label: Captain Jake's Lake Adventures, swimming and cliff jumping at own risk
      url: https://tablerocklakecaptain.com/
      accessed: "2026-10-19"
    - label: KSHB, Coast Guard document on the 2018 duck boat sinking
      url: https://www.kshb.com/news/state/missouri/coast-guard-document-tourist-boat-violated-inspection-terms
      accessed: "2026-10-19"
