  - slug: what-fees-are-extra-on-a-table-rock-lake-boat-rental
    question: What costs are not included in the price of a Table Rock Lake boat rental?
    answer: >-
      On Table Rock Lake, gas and sales tax are usually extra on a self-drive rental, and marinas
      often hold a security deposit on a card. Some sell an optional damage waiver, and tubes, skis
      or boards can cost more. At least one marina prices as advertised with no tax added.
    detail: >-
      Fuel is the main add-on. As of October 2026, the state park marina, a west-end marina and a
      Kimberling City marina all said gas was not part of the posted rate, and the last two also
      listed tax as additional. Plan on a fuel charge when the boat comes back.

      Deposits come next. The state park marina holds $500 on a credit card you present in person,
      and it takes a card when you reserve that it can charge if you never show. Other companies on
      the lake ask for a deposit but do not post the amount.

      Waivers and toys vary by marina. The Kimberling City marina sold an optional $44
      non-refundable damage waiver. The west-end marina offered optional liability coverage, or
      liability plus damage coverage with a $250 deductible. On the James River arm, one marina adds
      $30 to a rental for tubes, skis or boards, and it says its prices include tax.

      On a captained trip, one captain added 10 percent for cards or checks processed online and said
      a tip is never required. Whichever route you take, ask for a figure that includes fuel, tax,
      the deposit hold and every add-on before you commit.
    sources:
