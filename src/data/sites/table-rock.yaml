rules:
  summary: >-
    Boater cards on the Missouri side. A 2026 change to Missouri law means that on the state's lakes,
    anyone born after January 1, 1984 and before January 1, 2006 has to carry a boating safety
    identification card while driving, and starting January 1, 2027 so does anyone born on or after
    January 1, 2006. Marinas here can sell a seven-day temporary card for $9, once in a lifetime,
    with a driver's license. Big Cedar's marinas say they offer it.

    Age and experience. The Highway Patrol sets 14 as the operator minimum unless an adult is
    aboard. Rental companies here set their own floor much higher, commonly 21 or 25, and the state
    park marina says it will not rent to first-time drivers. At least two rental companies require boats back at the dock by dark.

    The Arkansas end. Part of the lake lies in Arkansas, which has its own boater education rule.
    If you rent from a marina on the Arkansas side, ask them what applies.

    Alcohol and life jackets. Missouri's limit for the person driving is .08 percent blood alcohol,
    or .02 percent under age 21. Children under seven must wear a life jacket, and there must be a
    wearable one aboard for everyone.

    Paying passengers. A captain carrying paying guests on an uninspected boat is generally limited
    to six, and larger passenger boats need a Coast Guard Certificate of Inspection. The Coast Guard
    advises asking to see the captain's license before you board.
  sources:
    - label: Missouri Revisor of Statutes, RSMo 306.127, boater identification card
      url: https://revisor.mo.gov/main/OneSection.aspx?section=306.127
      accessed: "2026-10-19"
    - label: Missouri State Highway Patrol, boater education law FAQs
      url: https://apps.mshp.dps.mo.gov/MSHPWeb/WaterPatrol/BoatingLaws_Education/boaterEduLawFAQ.html
