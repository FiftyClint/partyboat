  - slug: how-many-people-fit-on-a-party-boat-on-table-rock-lake
    question: How many people can fit on a party boat or slide boat on Table Rock Lake?
    answer: >-
      On Table Rock Lake, a self-drive tritoon usually holds 10 to 15 people and a double-deck slide
      boat 14 to 18, based on marina listings checked in October 2026. Paid captained trips on an
      uninspected boat are generally capped at six guests. For a bigger group, a sailing
      catamaran takes private charters for up to 49.
    detail: >-
      Tritoons are the everyday rental here. Listings on October 19, 2026 ran from 10 passengers on
      a 25-foot tritoon at a west-end marina to 14 or 15 on the larger tritoons at a Branson-side
      resort marina.

      Slide boats carry more. The biggest one listed, a 30-foot boat with two decks and dual slides
      at the state park marina, is rated for 18. Other double-deck slide boats on the lake, including
      one at that same Branson-side resort, are rated for 14. No rental boat in the listings checked
      carried more than 18, so a group past that size needs two boats or a different kind of trip.

      For a large party, the sailing catamaran that leaves from the state park marina runs a
      three-hour private swim and sail charter for up to 49 people.

      With a captain, size depends on the boat and how the trip is arranged. Under Coast Guard rules,
      an uninspected boat with paying guests is generally held to six of them, and carrying more
      calls for an inspected passenger vessel. Ask the operator how many guests their boat and
      license allow, and count every person, kids included, when you send your headcount.
    sources:
