faq:
  - question: Where can we get a slide boat on Table Rock?
    answer: >-
      Double-deck slide boats are rented by a handful of the larger marinas, mostly on the Branson
      side and at Kimberling City, plus one independent rental company mid-lake. There are not many
      of them, so they are the first boats to go on summer weekends. Put "slide boat" on the
      request and the operator will tell you what is open.
  - question: Can a 21 year old rent a boat here?
    answer: >-
      Sometimes. Missouri law sets a much lower minimum, but most Table Rock rental companies set
      their own at 21 or 25, and some will not rent to a first-time driver. If the group is young,
      ask for a boat with a captain.
  - question: Do we need a boater card?
    answer: >-
      On the Missouri side, most adults born after January 1, 1984 do, but marinas can sell a
      one-time temporary card at the counter if you bring a driver's license. The local guide has
      the details, including what changes in 2027.
  - question: Can we stay out for sunset?
    answer: >-
      Often not on a self-drive rental. Some rental companies require boats back by dark, and one says its insurer will not cover night operation. Sunset cruises and captained trips are the way to see it from the
      water.
  - question: Is there a party cove like at Lake of the Ozarks?
    answer: >-
      Not really. Table Rock is quieter. Groups anchor in a cove of their choosing to swim and
      float. If you want a big party crowd, Lake of the Ozarks is the Missouri lake known for that.
  - question: Who do we actually book with?
    answer: >-
      With the operator. We are an independent guide and do not own boats. We pass your request to
      one Table Rock operator, and they quote, book and run the trip.

forOperators: >-
  This site is written for visitors planning a boat day around a Branson trip, a show, a family reunion, Silver Dollar City, who want one company to tell them which boat fits their group. This site is built to answer that question and hand the request to one
  operator on the lake. We are looking for a marina or captain who handles groups, rents slide
  boats or captained trips, and can show current credentials and insurance.

