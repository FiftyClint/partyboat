pricing:
  summary: >-
    Table Rock marinas publish fewer prices than most lakes. Several quote only through a booking
    engine or by phone. What was published on October 19, 2026 is below, as ranges. One rate page
    still carried pandemic-era wording, so treat its numbers as possibly out of date and confirm.

    Self-drive tritoons and slide boats ran about $329 to $459 for three hours, $479 to $699 for six,
    and $539 to $749 for eight. Rentals of nearly a full day ran about $559 to $779. A boat and
    captain together for a small group started around $300 for two hours plus $100 an hour after
    that, and a captain alone for a boat you have rented ran $60 to $100 an hour. A private
    three-hour charter of the sailing catamaran for up to 49 people was $1,400.
  components:
    - title: Gas and tax
      body: >-
        Most marinas add fuel and sales tax on top of the posted rate. At least one prices as
        advertised with no tax added. Ask which you are looking at.
    - title: Deposit
      body: >-
        The state park marina holds $500 on a card presented in person, plus a card at booking against
        a no-show. Others require a deposit without publishing the amount.
    - title: Damage waivers and extras
      body: >-
        Some marinas sell an optional damage waiver. Tubes, skis and boards are usually an extra
        charge.
    - title: Cancellation and weather
      body: >-
        Notice periods run from 24 to 72 hours depending on the company, and one charges half the
        rental for a late cancellation. Marinas cancel for dangerous weather and offer a new date
        or a refund. Light rain usually does not cancel a trip.
