  - slug: how-much-does-a-boat-captain-cost-on-table-rock-lake
    question: How much does it cost to hire a boat captain on Table Rock Lake?
    answer: >-
      On Table Rock Lake, a private captained charter for up to six people started around $300 for
      two hours, plus $100 for each extra hour, and that price covered the boat, fuel and taxes, as
      of October 2026. Hiring a captain alone to drive a boat you rented ran about $60 to $100 an hour.
    detail: >-
      There are two ways to have someone else drive. In a charter, the captain brings the boat. With
      a captain for hire, the captain drives a boat you rented from a marina. The first is simpler to
      arrange. The second is how a group gets a slide boat without anyone in the group at the wheel.

      Published on October 19, 2026, one charter captain listed $300 for two hours for up to six
      guests and $100 an hour after that, covering the captain, boat, fuel, taxes, safety gear and
      insurance. A resort marina south of Branson offered a captain package built on a $100 an hour
      captain's fee, with a two-hour minimum and room for six.

      Captain-for-hire rates ran $60 an hour at one company, or $80 on federal holidays, with a $50
      non-refundable booking fee. Food, drinks, the boat and fuel were not part of that rate. Another
      captain listed $100 an hour with a four-hour minimum.

      Federal rules generally cap paying passengers at six on a boat that has not been through a
      Coast Guard inspection. Ask to see the captain's license before anyone steps aboard, and if the
      group is larger than six, ask exactly how the trip is set up.
    sources:
