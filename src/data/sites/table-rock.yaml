meta:
  title: "Party Boats and Slide Boats on Table Rock Lake"
  description: >-
    Double-deck slide boats, tritoons and captained trips on Table Rock Lake near Branson: which
    marina, what it costs, and who is allowed to drive.

hero:
  headline: "A party boat day on Table Rock Lake"
  subhead: >-
    Slide boats, tritoons and boats with a captain, out of Branson, Kimberling City and the
    marinas around the lake. Send us the date and the group and we pass it to one local operator.

directAnswer: >-
  Table Rock is a lake of bluffs and coves, and a party day here usually means finding a
  quiet cove to swim, float and eat, rather than a crowded raft-up. The boat most groups want is a
  double-deck pontoon with a slide off the top deck, which the bigger marinas around Branson rent
  for groups in the mid-teens. Smaller groups rent a tritoon. If nobody wants to drive, or the
  group is new to boats, a captain can take you out on a rented boat or their own. Weekends from
  Memorial Day to Labor Day are the ones to ask about early.

steps:
  - >-
    Tell us when you are coming, how many are in the group, and whether you want a slide boat, a
    plain tritoon, or someone else at the wheel. A headcount range is fine.
  - >-
    We hand the request to one operator on Table Rock who handles groups, so you deal with one
    company instead of calling marina after marina around the lake.
  - >-
    They confirm the boat, the marina you leave from, what the price includes, and the rules on age
    and boater cards. Booking and payment are between you and them.

boatTypes:
  intro: >-
    Rental boats on Table Rock are mostly pontoons and tritoons. What changes is the size, the
    extras, and who drives.
  types:
    - title: Double-deck slide boat
      body: >-
        A long pontoon with a second deck and a slide into the water, sometimes two. This is the
        party boat on Table Rock, and the big ones carry a bigger group than a standard
        tritoon. Only a handful of marinas rent them, so ask early for a summer weekend.
    - title: Tritoon or pontoon
      body: >-
        The everyday rental. Room for a family or a group of friends, and a swim ladder. Most marinas around the lake rent them.
    - title: A boat with a captain
      body: >-
        Some resorts and independent captains offer a boat and captain together for small groups,
        and some captains will drive a boat you have rented. Useful if nobody has a boater card or
        anyone wants to drink.
    - title: Cruises and sailing
      body: >-
        A sailing catamaran runs swim and sunset cruises from the dam end of the lake, sells seats
        to the public, and takes private groups too. A small yacht cruise also operates. Good for a
        big group that wants one boat and no driving at all.

departures:
  intro: >-
    Table Rock spreads across southwest Missouri and into northwest Arkansas, and its marinas are
    far apart by road. Most visitors stay around Branson, so the marinas near the dam and along the
    Branson side get the most party bookings, but the west end is worth a look if you are staying
    near Kimberling City or Shell Knob.
  places:
    - title: Branson and the dam end
      body: >-
        Table Rock State Park's marina, the Chateau on the Lake marina and Rock Lane Resort all rent
        boats on the Branson side, including double-deck slide boats. The sailing catamaran leaves
        from here too.
    - title: Ridgedale and Big Cedar
      body: >-
        South of Branson, Big Cedar Lodge runs two marinas, Long Creek and Bent Hook, with rentals
        and a captain package.
    - title: Kimberling City
      body: >-
        Mid-lake on Highway 13, with the Port of Kimberling marina renting slide pontoons and a
        houseboat company based nearby.
    - title: Lampe and the central lake
      body: >-
        An independent pontoon rental company operates out of the Baxter Marina complex, with
        tri-toons including one with a slide and grill.
    - title: Cape Fair and Galena, on the James River arm
      body: >-
        Two marinas up the James River arm. Cape Fair sits inside a Corps of Engineers park; tell
        the gate you are going to the marina store.
    - title: Shell Knob and Cassville, the west end
      body: >-
        Campbell Point, Kings River and Big M marinas rent tritoons on the quieter western end of
        the lake.
