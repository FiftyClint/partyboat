  - slug: how-to-get-a-temporary-boater-card-at-table-rock-lake
    question: Can I get a temporary boater card at a Table Rock Lake marina if I do not have one?
    answer: >-
      Yes, on the Missouri side of Table Rock Lake. State law lets a rental business issue a one-time
      temporary boating safety card for $9, good for up to seven days. You need a valid driver's
      license and must sign a statement that you reviewed the Highway Patrol boating handbook. You
      can use this option only once in your life.
    detail: >-
      Missouri requires a boating safety identification card on board for drivers born after January
      1, 1984 and before January 1, 2006 when they run a boat on the state's lakes. Starting January
      1, 2027, the rule reaches anyone born on or after January 1, 2006, on all state waters. The
      temporary card covers a renter who falls in one of those groups and has never taken the course.

      Two resort marinas at Ridgedale, south of Branson, say they offer the $9 card for seven days,
      once per lifetime, and ask for a driver's license and a credit card. The state park marina
      points renters to a one-time temporary permit they can get online. Sort it out before the day
      of the trip so the whole group is not waiting at the counter.

      You may not need it. The law exempts nonresidents who carry a NASBLA-approved card from their
      home state, holders of a Coast Guard master's license, and active military members and their
      spouses. If you took a boating course back home, bring that card.

      All of this is Missouri law. Part of Table Rock lies in Arkansas, so if your marina is on that
      side, ask the staff which rule applies there.
    sources:
