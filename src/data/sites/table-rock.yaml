  - slug: what-happens-to-a-table-rock-lake-boat-rental-in-bad-weather
    question: What happens to my Table Rock Lake boat rental if the weather turns bad or I need to cancel?
    answer: >-
      On Table Rock Lake, marinas cancel rentals for unsafe weather and offer a new date or a refund,
      while light rain usually does not stop a trip. If you cancel yourself, notice periods published
      as of October 2026 ran from 24 to 72 hours, and one marina charges half the rental for a late
      cancellation.
    detail: >-
      The marina or the captain makes the weather call. A Branson-side marina says unsafe weather
      means a reschedule or a refund under its rental agreement, and that light rain typically does
      not cancel. A west-end marina may cancel for bad weather and offers a new date or a full
      refund. One charter captain decides on conditions and refunds 100 percent of a prepaid trip
      when no other date works.

      Your own cancellation window depends on the company. The state park marina wants 72 hours or
      charges a no-show fee of half the rental rate. The west-end marina refunds in full with 48
      hours notice on 6-hour, 8-hour and 24-hour rentals, and asks for 5 days on rentals of two days
      or longer. The charter captain asks for 24 hours. That same west-end marina also charges $50
      for every 30 minutes a boat comes back late.

      Weather on this lake deserves respect. In July 2018 a tour boat sank on Table Rock during a
      severe storm and 17 people died. If an operator calls off your day, take the new date and plan
      something on land.
    sources:
