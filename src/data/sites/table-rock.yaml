  - slug: where-to-anchor-and-swim-on-table-rock-lake
    question: Where are good coves to anchor a boat and swim on Table Rock Lake?
    answer: >-
      On Table Rock Lake, Cow Creek on Point 6, between Table Rock State Park and the Port of
      Kimberling, is a deep, lightly developed cove that boaters use for swimming and as a meeting
      spot. The bluffs near Old 86 Campground are another known stop. Most groups simply pick a
      quiet cove, anchor and float.
    detail: >-
      Table Rock has no single big raft-up. The lake has roughly 745 miles of shoreline, and a usual
      day on the water means choosing a cove, setting the anchor and getting in. An August 2018
      roundup in 417 Magazine named a few spots that locals like.

      Cow Creek, off Point 6, sits mid-lake between the state park and the Kimberling City side. The
      water runs deep enough to swim, there is little building on shore, and boaters use it to meet
      friends on other boats. It suits a group that wants to tie up near people they know.

      The bluffs near Old 86 Campground are known for their cliffs. Some visitors jump from them,
      but one local captain treats swimming and jumping as entirely at the guest's own risk, and this
      guide does not suggest it. Swim off the boat instead, and keep anyone who has had a drink off
      the rocks.

      If you hire a captain or rent from a marina, ask where they like to anchor for your group and
      the day's wind. Missouri requires children under seven to wear a life jacket on board, so pack
      the right sizes.
    sources:
